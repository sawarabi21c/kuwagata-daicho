/* ---------- 近い血のペアのお知らせ（改善㉒） ---------- */
// 名前で先祖をたどり（台帳の個体と手入力の血統、3代まで）、♂と♀に同じ先祖がいれば知らせる。止めはしない
function ancestorNames(b) {
  const out = [];
  if (!b) return out;
  if (b.code) out.push({ name: b.code, gen: 0 });
  [...PED_PARENTS, ...PED_GRAND, ...PED_GREAT].forEach(p => { const a = ancestor(b, p); if (a.name) out.push({ name: a.name, gen: p.length }); });
  return out;
}
function kinship(maleName, femaleName) {
  const m = byName(maleName), f = byName(femaleName);
  if (!maleName || !femaleName) return "";
  const am = m ? ancestorNames(m) : [{ name: maleName, gen: 0 }], af = f ? ancestorNames(f) : [{ name: femaleName, gen: 0 }];
  if (am.length < 2 && af.length < 2) return "";
  const mf = m ? [m.fatherName, m.motherName] : [], ff = f ? [f.fatherName, f.motherName] : [];
  if (mf.includes(femaleName) || ff.includes(maleName)) return "親子の組み合わせです";
  const sameF = m && f && m.fatherName && m.fatherName === f.fatherName, sameM = m && f && m.motherName && m.motherName === f.motherName;
  if (sameF && sameM) return "きょうだい（両親が同じ）の組み合わせです";
  if (sameF || sameM) return `半きょうだい（${sameF ? "♂親" : "♀親"}が同じ）の組み合わせです`;
  let best = null;
  am.filter(x => x.gen > 0).forEach(x => af.filter(y => y.gen > 0 && y.name === x.name).forEach(y => { const d = Math.max(x.gen, y.gen); if (!best || d < best.d) best = { name: x.name, d, gx: x.gen, gy: y.gen }; }));
  if (!best) return "";
  if (best.gx === 2 && best.gy === 2) return `いとこ（祖父母の「${best.name}」が同じ）の組み合わせです`;
  if (best.gx === 1 || best.gy === 1) return `おじ・おば と めい・おい に近い組み合わせです（「${best.name}」が同じ先祖）`;
  return `${best.d}代前に同じ先祖「${best.name}」がいます`;
}
const kinHtml = (male, female) => { const t = kinship(male, female); return t ? `⚠ ${esc(t)}。血が近いので、組み合わせを確かめてください。` : ""; };

/* ---------- 産卵セットを何回分も（改善⑪）・割り出し予定日（改善㉑）・ペアのラベル ---------- */
// ペアの産卵セットは p.sets = [{ startDate（同居開始）, setDate（産卵セット）, dueDate（割り出し予定を手で直したとき）, harvestDate（割り出し）, eggs, larvae, setup }]。
// 古いペア（sets が無い）は、前の欄（startDate・setDate・harvestDate・eggs・larvae・setup）を1回目として読む。
// ほかの所（子の一括登録・CSV・AI担当）が前の欄を読むので、保存するときは表から前の欄にも写しておく（mirrorSets）
const SET_KEYS = ["startDate", "setDate", "dueDate", "harvestDate", "eggs", "larvae", "setup"];
const setFilled = s => s && SET_KEYS.some(k => s[k] !== undefined && s[k] !== null && s[k] !== "");
function setsOf(p) {
  if (Array.isArray(p.sets)) return p.sets;
  const legacy = { startDate: p.startDate || "", setDate: p.setDate || "", harvestDate: p.harvestDate || "", eggs: p.eggs ?? null, larvae: p.larvae ?? null, setup: p.setup || "" };
  return setFilled(legacy) ? [legacy] : [];
}
function mirrorSets(p) {
  const s = p.sets || [], lastWith = k => [...s].reverse().find(x => x[k] !== undefined && x[k] !== null && x[k] !== "");
  const sum = k => s.some(x => typeof x[k] === "number") ? s.reduce((a, x) => a + (Number(x[k]) || 0), 0) : null;
  p.startDate = s.find(x => x.startDate)?.startDate || "";
  p.setDate = lastWith("setDate")?.setDate || "";
  p.harvestDate = lastWith("harvestDate")?.harvestDate || "";
  p.setup = lastWith("setup")?.setup || "";
  p.eggs = sum("eggs"); p.larvae = sum("larvae");
  return p;
}
// 割り出し予定日：手で直した日、なければ「産卵セット日＋種類ごとの日数」（種類の登録で決める。決めていなければ出さない）
const harvestDaysFor = sp => Number((state.masters.harvestDays || {})[sp]) || 0;
const dueOf = (s, sp) => s.dueDate || (s.setDate && harvestDaysFor(sp) ? addDays(s.setDate, harvestDaysFor(sp)) : "");
// 割り出し待ちのセット（産卵セット日があって、割り出し日がまだ）。終了したペアは出さない
function pairDue(p) {
  if (p.status === "終了") return null;
  const all = setsOf(p), s = [...all].reverse().find(x => x.setDate && !x.harvestDate);
  const due = s ? dueOf(s, p.species) : "";
  return due ? { due, n: all.indexOf(s) + 1 } : null;
}
const dueTagHtml = d => { const n = daysUntil(d); return n < 0 ? `<span class="tag over">${-n}日超過</span>` : n === 0 ? '<span class="tag over">今日</span>' : n <= 14 ? `<span class="tag soon">あと${n}日</span>` : ""; };

// ペアの登録画面の表。はじめは3回分、全部埋まったら1行増える
function setRowHtml(s = {}, i = 0, sp = "") {
  const d = (k, label) => `<label>${label}<input type="date" data-set="${k}" value="${esc(s[k] || "")}"></label>`;
  const auto = s.setDate && harvestDaysFor(sp) ? addDays(s.setDate, harvestDaysFor(sp)) : "";
  return `<div class="set-row">
    <span class="xno">${i + 1}回目</span>
    ${d("startDate", "同居開始日")}${d("setDate", "産卵セット日")}
    <label>割り出し予定日<input type="date" data-set="dueDate" value="${esc(s.dueDate || "")}"><span class="hint set-auto">${auto ? "自動：" + fmtDate(auto) : ""}</span></label>
    ${d("harvestDate", "割り出し日")}
    <label>卵の数<input type="number" data-set="eggs" min="0" step="1" inputmode="numeric" value="${esc(s.eggs ?? "")}"></label>
    <label>幼虫の数<input type="number" data-set="larvae" min="0" step="1" inputmode="numeric" value="${esc(s.larvae ?? "")}"></label>
    <label class="set-setup">セット内容<input type="text" data-set="setup" list="setupList" value="${esc(s.setup || "")}" placeholder="例 産卵木＋マット"></label>
  </div>`;
}
function setRowsHtml(p, sp) {
  const s = p ? setsOf(p) : [{ startDate: today() }];
  const n = s.length >= 3 ? s.length + 1 : 3;
  return Array.from({ length: n }, (_, i) => setRowHtml(s[i] || {}, i, sp)).join("");
}
function readSets() {
  return [...document.querySelectorAll("#setRows .set-row")].map(r => {
    const s = {};
    r.querySelectorAll("[data-set]").forEach(el => {

// 最後の行に入力したら、次の空の行を足す
function growSetRows(el) {

}
// ペアの画面の表
function setsTable(p) {

      <td>${d(x.harvestDate)}</td><td class="r num">${[x.eggs ?? "", x.larvae ?? ""].some(v => v !== "") ? `${x.eggs ?? "—"}・${x.larvae ?? "—"}` : ""}</td><td>${esc(x.setup || "")}</td></tr>`; }).join("")}</tbody>

// ペアのラベル（A4に8段×2列、1枚 98×35.4mm）。紙のラベルと同じ形：管理番号・♂×♀・1〜5回目の表
const PAIR_LABELS_PER_PAGE = 16;
function pairLabelCell(p, withQr = state.plQr !== false) {
  if (!p) return `<div class="plbl blank"></div>`;

/* ---------- 血統（3代） ---------- */
// 先祖の場所を f（父）/ m（母）の並びで表す。"fm" は「父の母」
const PED_PARENTS = ["f", "m"];
const PED_GRAND = ["ff", "fm", "mf", "mm"];
const PED_GREAT = ["fff", "ffm", "fmf", "fmm", "mff", "mfm", "mmf", "mmm"];
const pedRel = p => p.split("").map(c => c === "f" ? "父" : "母").join("の");
const pedSex = p => p.endsWith("f") ? "♂" : "♀";
// 台帳に登録されている先祖は記録からたどる。たどれない所は、個体に手入力した血統（b.pedigree）を使う
function ancestor(b, path, depth = 0) {
  const manual = (b.pedigree && b.pedigree[path]) || {};
  const isF = path[0] === "f";
  const pName = isF ? b.fatherName : b.motherName;
  const rec = pName && depth < 8 ? byName(pName) : null;
  if (path.length === 1) {
    const pSize = isF ? b.fatherSize : b.motherSize;
    return { name: pName || "", size: pSize ?? rec?.sizeMm ?? null, breeder: rec?.breeder || manual.breeder || "", auto: !!rec };
  }
  if (rec) {
    const a = ancestor(rec, path.slice(1), depth + 1);
    if (a.name || a.size || a.breeder) return { ...a, breeder: a.breeder || manual.breeder || "", auto: true };
  }
  return { name: manual.name || "", size: manual.size ?? null, breeder: manual.breeder || "", auto: false };
}
// 編集画面の「血統（3代）」欄。台帳からたどれる値は、うすい文字（入力例）で見せる
function pedigreeRows(v) {

    const m = (v.pedigree && v.pedigree[p]) || {};

  return `<details class="wide ped-edit"${v.pedigree && Object.keys(v.pedigree).some(k => k.length > 1) ? " open" : ""}>

  </details>`;
}

function refreshPedHints() {
  const draft = { fatherName: $("fFather").value.trim(), motherName: $("fMother").value.trim(), pedigree: {} };
  [...PED_GRAND, ...PED_GREAT].forEach(p => {
    const a = ancestor(draft, p);
    if ($(`ped_${p}_name`)) { $(`ped_${p}_name`).placeholder = a.name; $(`ped_${p}_size`).placeholder = a.size ?? ""; $(`ped_${p}_breeder`).placeholder = a.breeder; }
  });
  $("ped_f_breeder").placeholder = byName(draft.fatherName)?.breeder || "";
  $("ped_m_breeder").placeholder = byName(draft.motherName)?.breeder || "";
}
// 編集画面から手入力の血統を読む（空の所は保存しない）
function readPedigree() {
  const ped = {};
  [...PED_PARENTS, ...PED_GRAND, ...PED_GREAT].forEach(p => {
    const get = k => $(`ped_${p}_${k}`) ? $(`ped_${p}_${k}`).value.trim() : "";
    const e = {};
    if (get("name")) e.name = get("name");
    if (get("size") !== "") e.size = Number(get("size"));
    if (get("breeder")) e.breeder = get("breeder");
    if (Object.keys(e).length) ped[p] = e;
  });
  return ped;
}

/* ---------- 何世代でも遡れる血統表（改善⑱：画面で見るだけ。印刷はしない） ---------- */
// はじめは3代。チェックで4代目・5代目…と増やす（この端末に覚える）。台帳にいる先祖は名前でどこまでもたどり、
// たどれない4代目より先は、この画面で手入力できる（個体の pedigree に、f/m の並びの長さ4以上の場所で入る）
const TREE_MAX = 7;
const pathsOf = g => Array.from({ length: 2 ** g }, (_, i) => i.toString(2).padStart(g, "0").replace(/0/g, "f").replace(/1/g, "m"));
const treeDepth = () => Math.min(TREE_MAX, Math.max(3, +meta.get("treeDepth") || 3));
// 累代票の画面（1頭のとき）の下に出す。印刷は累代票の3代のまま（2026-11-17 あっきーさんの希望で、血統表を累代票にまとめた）
function treeBox(b) {
  if (!b) return "";
  const depth = treeDepth(), rows = 2 ** depth;
  const cell = p => {
    const a = ancestor(b, p), g = p.length, sx = pedSex(p), rec = a.name ? byName(a.name) : null;
    const edit = state.treeEdit && g >= 4 && !a.auto;
    const m = (b.pedigree && b.pedigree[p]) || {};
    const body = edit
      ? `<input type="text" data-tp="${p}|name" value="${esc(m.name || "")}" placeholder="名前" aria-label="${pedRel(p)}の名前"><input type="number" step="0.1" min="0" data-tp="${p}|size" value="${esc(m.size ?? "")}" placeholder="mm" aria-label="${pedRel(p)}のサイズ" style="width:5.5em"><input type="text" data-tp="${p}|breeder" value="${esc(m.breeder || "")}" placeholder="ブリーダー" aria-label="${pedRel(p)}のブリーダー">`
      : `<span class="sex ${sx === "♂" ? "m" : "f"}">${sx}</span> ${rec ? `<button class="link" type="button" data-open="${esc(rec.id)}">${esc(a.name)}</button>` : esc(a.name || "—")}${a.size ? ` <span class="num">${esc(a.size)}mm</span>` : ""}${a.breeder ? `<span class="hint" style="display:block">${esc(a.breeder)}</span>` : ""}`;
    return `<div class="tree-cell g${g}${a.name ? "" : " empty"}" style="grid-column:${g};grid-row:${pathsOf(g).indexOf(p) * 2 ** (depth - g) + 1} / span ${2 ** (depth - g)}" title="${esc(pedRel(p))}">${body}</div>`;
  };
  return `
    <div class="box">
      <h3 class="section-title">もっと前の血統（画面で見るだけ）</h3>
      <div class="row">${Array.from({ length: TREE_MAX - 3 }, (_, i) => i + 4).map(g => `<label class="check"><input type="checkbox" data-treegen="${g}"${depth >= g ? " checked" : ""}> ${g}代目</label>`).join("")}</div>
      ${depth > 3 ? `<div class="row"><label class="check"><input type="checkbox" id="treeEdit"${state.treeEdit ? " checked" : ""}> 台帳にいない4代目より先を入力する</label>${state.treeEdit ? `<button class="btn small primary" type="button" data-treesave="${esc(b.id)}">入力を保存</button>` : ""}</div>` : ""}
      <p class="hint">上の累代票（印刷するもの）は3代までです。チェックを入れると、4代目より先もここに出ます（印刷はしません）。名前に線がある先祖は台帳にいて、押すとその個体が開きます。3代目までの手入力は、個体の「編集」の「血統」の欄で入れます。</p>
      ${depth > 3 ? `<div class="tree-wrap"><div class="tree" style="grid-template-columns:repeat(${depth}, minmax(9em, 1fr));grid-template-rows:repeat(${rows}, minmax(${depth > 5 ? 20 : 30}px, auto))">
        ${Array.from({ length: depth }, (_, i) => pathsOf(i + 1).map(cell).join("")).join("")}
      </div></div>` : ""}
    </div>`;
}

// コピー元の名前の末尾の番号を1つ進めた、まだ使われていない名前（M.T2026A_04 → M.T2026A_05）
function nextCodeFrom(code, taken = new Set()) {
  const m = String(code || "").match(/^(.*?)(\d+)$/);
  for (let n = m ? +m[2] + 1 : 2; n < 100000; n++) {
    const c = m ? m[1] + String(n).padStart(m[2].length, "0") : `${code}_${n}`;
    if (!byName(c) && !taken.has(c)) return c;
  }
  return "";
}
// first から始めて、空いている名前を count 個（使われている番号は飛ばす）
function copyNames(first, count) {
  const names = [first];
  while (names.length < count) {
    const c = nextCodeFrom(names[names.length - 1], new Set(names));
    if (!c) break;
    names.push(c);
  }
  return names;
}
function updateCopyPreview() {
  if (!$("copyPreview")) return;
  const n = Math.min(200, Math.max(1, Math.round(+$("fCopyCount").value || 1)));
  const names = copyNames($("fCode").value.trim(), n);
  const dup = names.filter(byName);
  $("copyPreview").innerHTML = (n > 1 ? `${esc(names[0])} 〜 ${esc(names[names.length - 1])} の ${names.length} 頭を登録します。` : "")
    + (dup.length ? `<strong style="color:var(--danger)">${esc(dup.join("、"))} はすでにあります。</strong>` : "");
}

/* ---------- 画像（縮小してから保存） ---------- */
function resizeImage(file, max = 1200) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}

      });

/* ---------- 写真から読み取った値の取り込み ----------
   AI担当が写真（ラベル・体重計）から作った小さなJSONを、名前（code）で個体に合わせ、
   「古い値→新しい値」を並べて見せる。チェックしたものだけを、人が「反映する」を押して書き込む。
   形：{"items":[{"code":"M.T2026B_20","pupationDate":"2026-11-17","pupaWeight":34.8,"eclosionDate":"","sizeMm":""}]}
   入れられる項目は UPD_FIELDS の4つだけ。新しい個体は作らない。 */
const UPD_FIELDS = [
  { key: "pupationDate", label: "蛹化日", kind: "date" },
  { key: "pupaWeight", label: "蛹化時の体重", kind: "num", unit: "g" },
  { key: "eclosionDate", label: "羽化日", kind: "date" },
  { key: "sizeMm", label: "体長", kind: "num", unit: "mm" },
];
const updShow = (f, v) => v === undefined || v === null || v === "" ? "（空）" : f.kind === "date" ? fmtDate(v) : `${v}${f.unit}`;
function parseUpdate(text, name) {
  const src = String(text || "").trim().replace(/^```[a-z]*\s*/i, "").replace(/\s*```$/, "");
  let data;
  try { data = JSON.parse(src); } catch { return null; }
  const items = Array.isArray(data) ? data : data && Array.isArray(data.items) ? data.items : null;
  if (!items) return null;
  const rows = [], problems = [];
  items.forEach(it => {
    const code = String((it && it.code) ?? "").trim();
    if (!code) { problems.push("名前（code）のない行があります"); return; }
    const b = byName(code);
    if (!b) { problems.push(`${code}：台帳にありません（取り込みません）`); return; }
    let any = false;
    UPD_FIELDS.forEach(f => {
      const raw = it[f.key];
      if (raw === undefined || raw === null || raw === "") return;
      any = true;
      let v;
      if (f.kind === "num") {
        v = Number(raw);
        if (!(v > 0 && v < 300)) { problems.push(`${code}：${f.label}「${raw}」は数字として読めません`); return; }
      } else {
        v = String(raw);
        const dt = new Date(`${v}T00:00:00`);
        if (!/^\d{4}-\d{2}-\d{2}$/.test(v) || isNaN(dt) || localDate(dt) !== v) { problems.push(`${code}：${f.label}「${raw}」は日付（2026-11-17の形）として読めません`); return; }
      }
      const old = b[f.key];
      const empty = old === undefined || old === null || old === "";
      const same = !empty && (f.kind === "num" ? Number(old) === v : old === v);
      rows.push({ id: b.id, code: b.code, key: f.key, label: f.label, f, old, val: v, same, empty, pick: empty });
    });
    if (!any) problems.push(`${code}：取り込む項目がありません`);
  });
  return { name, rows, problems };
}

      ...(old ? structuredClone(old) : { id: newId("s"), createdAt: new Date().toISOString() }),
      name: val("sName"), category: $("sCat").value, unit: val("sUnit"), qty: num($("sQty").value) || 0,
      minQty: num($("sMin").value), link: $("sLink").value, memo: val("sMemo"),
    };
    if (await saveRec("stock", s)) { closePanel(); toast(old ? "保存しました" : "登録しました"); }
    return;
  }
  if (e.target.id === "editForm") {
    const old = state.beetles.find(x => x.id === state.openId);
    const b = {
      ...(old ? structuredClone(old) : { id: newId("b"), logs: [], createdAt: new Date().toISOString(), ...copiedPair() }),
      species: val("fSpecies"), code: val("fCode"), sex: $("fSex").value, line: val("fLine"), locality: val("fLocality"),
      stage: $("fStage").value, status: val("fStatus"), rank: val("fRank"),
      sizeMm: num($("fSize").value), headWidth: num($("fHeadWidth").value), jaw: num($("fJaw").value),
      fatherName: val("fFather"), fatherSize: num($("fFatherSize").value), motherName: val("fMother"), motherSize: num($("fMotherSize").value),
      breeder: val("fBreeder"), pedigree: { ...Object.fromEntries(Object.entries(old?.pedigree || {}).filter(([k]) => k.length >= 4)), ...readPedigree() },
      hatchDate: $("fHatch").value, harvestDate: $("fHarvest").value, pupationDate: $("fPupation").value, pupaWeight: num($("fPupaWeight").value),
      eclosionDate: $("fEclosion").value, nextChange: $("fNext").value,
      feeding: val("fFeeding"), container: val("fContainer"), storage: val("fStorage"), cumTemp: num($("fCumTemp").value),
      collectDate: $("fCollectDate").value, collectState: val("fCollectState"), collectPlace: val("fCollectPlace"),
      feedStartDate: $("fFeedStart").value, adultFood: val("fAdultFood"), adultCase: val("fAdultCase"),
      memo: $("fMemo").value.trim(),
    };
    if (state.draftImage !== undefined && old && old.image && state.draftImage !== old.image) {
      // 前の代表の写真は消さずに、写真の一覧へ移す
      b.photos = [...(b.photos || []), { id: newId("ph"), data: old.image, date: old.imageInfo?.date || "", kind: old.imageInfo?.kind || "" }];
      b.imageInfo = { date: today(), kind: kindByStage(b) };
    }
    if (state.draftImage !== undefined) b.image = state.draftImage;
    b.logs = readExchangeRows(old);
    // 一番新しい交換の内容を、個体の現在の飼育方法・状態にする（状態欄を自分で変えたときはそちらを優先）
    const exs = exchangeLogs(b);
    const lastEx = exs[exs.length - 1];
    const newest = b.logs.reduce((a, l) => !a || l.date >= a.date ? l : a, null);
    if (lastEx && lastEx === newest) {
      const lastWith = f => [...exs].reverse().find(l => l[f]);
      if (lastWith("food")) b.feeding = lastWith("food").food;
      if (lastWith("container")) b.container = lastWith("container").container;
      if (lastEx.state && b.stage === (old ? old.stage : "幼虫(1令)")) b.stage = lastEx.state;
    }
    // 今回新しく入れた交換の分だけ在庫を減らす
    const oldDates = new Set(exchangeLogs(old || {}).map(l => l.date));
    const added = exs.filter(l => !oldDates.has(l.date));
    // 新しい交換を入れて、次回交換予定を自分で変えていなければ自動計算する
    // （次回交換日の自動計算は、幼虫・卵のときだけ）
    if (added.includes(lastEx) && lastEx === newest && isLarva(b) && $("fNext").value === (old?.nextChange || "")) {
      b.nextChange = autoNext(lastEx.date, lastEx.food || b.feeding) || b.nextChange;
    }
    // コピーで数を指定したときは、名前を連番にして同じ内容で何頭か登録する
    const copyCount = !old && $("fCopyCount") ? Math.min(200, Math.max(1, Math.round(+$("fCopyCount").value || 1))) : 1;
    if (copyCount > 1) {
      const names = copyNames(b.code, copyCount);
      const dup = names.filter(byName);
      if (names.length < copyCount || dup.length) return toast(`${dup.join("、") || "名前"} はすでにあります。名前を変えてください`);
      const list = names.map((code, i) => i === 0 ? b : { ...structuredClone(b), id: newId("b"), code });
      try { await store.putMany(list); } catch { return toast("登録できませんでした。ブラウザの保存容量を確認してください"); }
      state.beetles.push(...list);
      const used = added.length ? await useStock(list.flatMap(x => exchangeLogs(x).filter(l => !oldDates.has(l.date)))) : "";
      openPanel(b.id);
      return toast(`${copyCount}頭を登録しました（${names[0]} 〜 ${names[names.length - 1]}）${used ? `。${used}` : ""}`);
    }
    if (byName(b.code) && (!old || old.code !== b.code)) return toast(`${b.code} はすでにあります。名前を変えてください`);
    state.openId = b.id; state.mode = "view"; state.draftImage = undefined;
    if (await save(b)) {
      const used = added.length ? await useStock(added) : "";
      toast((old ? "保存しました" : "登録しました") + (used ? `。${used}` : ""));
      render(); $("panel").scrollTop = 0;
    }
  }
  if (e.target.id === "pairForm") {
    const old = state.pairs.find(x => x.id === state.openId);
    const p = {
      ...(old ? structuredClone(old) : { id: newId("p"), createdAt: new Date().toISOString() }),
      name: val("pName"), status: $("pStatus").value, species: val("pSpecies"), locality: val("pLocality"), childLine: val("pChildLine"),
      maleName: val("pMale"), maleSize: num($("pMaleSize").value), femaleName: val("pFemale"), femaleSize: num($("pFemaleSize").value),
      endDate: $("pEnd").value, temp: val("pTemp"), memo: $("pMemo").value.trim(),
      sets: readSets(),
    };
    mirrorSets(p); // 前の欄（同居開始・産卵セット・割り出し・卵数・幼虫数）にも写す
    state.openId = p.id; state.mode = "pair";
    if (await savePair(p)) { toast(old ? "保存しました" : "ペアを登録しました"); $("panel").scrollTop = 0; }
  }
  if (e.target.id === "kidsForm") {
    const p = state.pairs.find(x => x.id === state.openId);
    const pre = $("kPrefix").value, s = +$("kStart").value || 0, n = Math.min(200, +$("kCount").value || 0);
    const w = Math.max(2, String(s + n - 1).length);
    const names = Array.from({ length: n }, (_, i) => pre + String(s + i).padStart(w, "0"));
    if (!n) return;
    if (names.some(byName)) return toast("同じ名前の個体がすでにあります。開始番号を変えてください");
    const kids = names.map(code => ({
      id: newId("b"), createdAt: new Date().toISOString(), logs: [], pairId: p.id,
      code, species: p.species, sex: "不明", line: val("kLine"), locality: p.locality, stage: $("kStage").value, status: "飼育中",
      fatherName: p.maleName, fatherSize: p.maleSize, motherName: p.femaleName, motherSize: p.femaleSize,
      hatchDate: $("kHatch").value, harvestDate: p.harvestDate || $("kHatch").value, feeding: val("kFeeding"), container: val("kContainer"),
      breeder: state.masters.breederName || "",
      nextChange: val("kFeeding") || val("kContainer") ? autoNext($("kHatch").value, val("kFeeding")) : "",
    }));
    try { await store.putMany(kids); } catch { return toast("登録できませんでした"); }
    state.beetles.push(...kids);
    if (p.status === "同居中" || p.status === "産卵セット中") {
      p.status = "割り出し済";
      const sets = setsOf(p).map(x => ({ ...x })), last = [...sets].reverse().find(x => x.setDate && !x.harvestDate);
      if (last) { last.harvestDate = $("kHatch").value; p.sets = sets; mirrorSets(p); }
      else if (!p.harvestDate) p.harvestDate = $("kHatch").value;
      await store.put(p, "pairs");
    }
    const used = kids[0].feeding || kids[0].container ? await useStock(kids.map(k => ({ food: k.feeding, container: k.container }))) : "";
    state.mode = "pair"; render(); renderPanel();
    toast(`${n}頭を登録しました${used ? `。${used}` : ""}`);
  }
  if (e.target.id === "logForm") {
    const b = structuredClone(state.beetles.find(x => x.id === state.openId));
    const date = $("logDate").value, st = $("logState").value;
    const entry = { date, state: st, work: $("logWork").value, food: val("logFood"), additive: $("logAdd").value, container: val("logContainer"), note: val("logNote") };
    withMix(entry);
    [["weight", "logWeight"], ["length", "logLength"], ["headWidth", "logHead"]].forEach(([k, id]) => { const v = num($(id).value); if (v !== null) entry[k] = v; });
    b.logs = [...(b.logs || []), entry];
    // 一番新しい記録の内容を個体の現在の状態にする
    const newest = b.logs.reduce((a, l) => !a || l.date >= a.date ? l : a, null);
    const wasAdult = isAdult(b);
    if (newest === entry) {
      if (st !== b.stage) {
        if (st === "蛹" && !b.pupationDate) b.pupationDate = date;
        if (st === "成虫" && !b.eclosionDate) b.eclosionDate = date;
        b.stage = st;
      }
      // 成虫のままの記録は「成虫のえさ」「ケース」に、それ以外は飼育方法・容器に反映する
      if (wasAdult && isAdult(b)) {
        if (entry.food) b.adultFood = entry.food;
        if (entry.container) b.adultCase = entry.container;
      } else {
        if (entry.food) b.feeding = entry.food;
        if (entry.container) b.container = entry.container;
      }
      if (st === "成虫" && entry.length) b.sizeMm = entry.length;
    }
    // 次回交換予定：入力があればそれ、なければえさ交換の日からえさごとの日数で自動計算（幼虫・卵のときだけ）
    if ($("logNext").value && isLarva(b)) b.nextChange = $("logNext").value;
    else if (entry.work === "えさ交換" && newest === entry && isLarva(b)) b.nextChange = autoNext(date, entry.food || b.feeding) || b.nextChange;
    if (await save(b)) {
      const used = entry.work === "えさ交換" ? await useStock([entry]) : "";
      toast("記録を追加しました" + (used ? `。${used}` : ""));
    }
  }
});

/* ---------- 候補の一覧（▼ボタン） ---------- */
// 候補つきの入力欄（list= がある欄）の右に ▼ を付ける。押すと、入っている文字に関係なく候補を全部出す
// （iPhoneのSafariは候補の一覧を出せず、PCも入っている文字で候補がしぼられて選べなくなるため。2026-11-18）
function ddEnhance(root = document) {
  root.querySelectorAll("input[list]:not([data-ddon])").forEach(inp => {
    inp.dataset.ddon = "1";
    const w = document.createElement("span");
    w.className = "dd";
    inp.parentNode.insertBefore(w, inp);
    w.appendChild(inp);
    w.insertAdjacentHTML("beforeend", '<button type="button" class="dd-btn" data-dd tabindex="-1" aria-label="候補から選ぶ">▼</button>');
  });
}
let ddInput = null;
function ddClose() { const pop = $("ddPop"); if (pop) pop.remove(); ddInput = null; }
function ddOpen(inp) {
  ddClose();
  const dl = document.getElementById(inp.getAttribute("list"));
  const opts = dl ? [...dl.querySelectorAll("option")].filter(o => o.value) : [];
  const pop = document.createElement("div");
  pop.id = "ddPop"; pop.className = "dd-pop"; pop.setAttribute("role", "listbox");
  pop.innerHTML = opts.length
    ? opts.map((o, i) => `<button type="button" class="dd-item${o.value === inp.value ? " on" : ""}" data-ddpick="${i}">${esc(o.value)}${o.textContent.trim() && o.textContent.trim() !== o.value ? `<small>${esc(o.textContent.trim())}</small>` : ""}</button>`).join("")
    : `<div class="dd-none">候補がありません（「種類の登録」で足せます）</div>`;
  pop._opts = opts.map(o => o.value);
  document.body.appendChild(pop);
  const r = inp.closest(".dd").getBoundingClientRect(), vh = window.innerHeight;
  const below = vh - r.bottom - 8, above = r.top - 8, up = below < 180 && above > below;
  pop.style.left = Math.max(8, Math.min(r.left, window.innerWidth - Math.max(r.width, 180) - 8)) + "px";
  pop.style.minWidth = Math.max(r.width, 180) + "px";
  pop.style.maxHeight = Math.max(120, Math.min(320, up ? above : below)) + "px";
  if (up) pop.style.bottom = (vh - r.top + 4) + "px"; else pop.style.top = (r.bottom + 4) + "px";
  ddInput = inp;
  const on = pop.querySelector(".on"); if (on) on.scrollIntoView({ block: "nearest" });
}
document.addEventListener("click", e => {
  const btn = e.target.closest("[data-dd]");
  if (btn) { e.preventDefault(); const inp = btn.parentNode.querySelector("input"); if (ddInput === inp) ddClose(); else ddOpen(inp); return; }
  const it = e.target.closest("[data-ddpick]");
  if (it && ddInput) {
    const inp = ddInput, v = $("ddPop")._opts[+it.dataset.ddpick];
    ddClose();
    inp.value = v;
    inp.dispatchEvent(new Event("input", { bubbles: true }));
    inp.dispatchEvent(new Event("change", { bubbles: true }));
    return;
  }
  if (ddInput && !e.target.closest("#ddPop")) ddClose();
}, true);
document.addEventListener("keydown", e => { if (e.key === "Escape" && ddInput) { e.stopImmediatePropagation(); ddClose(); } }, true);
document.addEventListener("scroll", e => { if (ddInput && !(e.target.closest && e.target.closest("#ddPop"))) ddClose(); }, true);
window.addEventListener("resize", () => { if (ddInput) ddClose(); });
new MutationObserver(() => ddEnhance()).observe(document.body, { childList: true, subtree: true });

/* ---------- boot ---------- */
if (BETA) {
  document.title = "クワガタ飼育台帳（ベータ版）";
  document.querySelector("header h1").textContent = "クワガタ飼育台帳（ベータ版）";
  document.querySelector('meta[name="apple-mobile-web-app-title"]').content = "飼育台帳β";
  $("backupBtn").textContent = "バックアップ";
}
takeRoute();
syncTakeRedirect();
render();
(async () => {
  try {
    state.beetles = await store.all();
    state.pairs = await store.all("pairs");
    state.money = await store.all("money");
    state.stock = await store.all("stock");
    const m = await store.get("masters", "settings");
    const src = m || seedMasters();
    MASTER_KINDS.forEach(({ key }) => state.masters[key] = Array.isArray(src[key]) ? src[key] : []);
    // 累代・ランクの一覧がまだ無いときは、よく使う値と今までに入力した値で作る
    let seeded = false;
    ["line", "rank"].forEach(k => { if (!Array.isArray(src[k])) { state.masters[k] = seedList(k); seeded = true; } });
    state.masters.intervals = src.intervals && typeof src.intervals === "object" ? src.intervals : {};
    state.masters.defaultInterval = src.defaultInterval ?? 90;
    state.masters.breederName = src.breederName || "";
    state.masters.hiddenFields = Array.isArray(src.hiddenFields) ? src.hiddenFields : [...DEFAULT_HIDDEN];
    state.masters.mixes = Array.isArray(src.mixes) ? src.mixes : [];
    state.masters.staleMonths = src.staleMonths ?? 12;
    state.masters.sizeThresholds = src.sizeThresholds && typeof src.sizeThresholds === "object" ? src.sizeThresholds : {};
    state.masters.codePrefixes = src.codePrefixes && typeof src.codePrefixes === "object" ? src.codePrefixes : {};
    state.masters.harvestDays = src.harvestDays && typeof src.harvestDays === "object" ? src.harvestDays : {};
    if (typeof src.logo === "string" && src.logo.startsWith("data:image/")) state.masters.logo = src.logo;
    if (typeof src.listingTemplate === "string" && src.listingTemplate.trim()) state.masters.listingTemplate = src.listingTemplate;
    // 保存は、全部の設定を読み終えてから（途中で保存すると、まだ読んでいない設定が消える）
    state.masters.updatedAt = src.updatedAt || "";
    const tb = await store.get("tombstones", "settings");
    state.tombs = Array.isArray(tb?.list) ? tb.list : [];
    if (!m || m.defaultInterval === undefined || seeded) await saveMasters(false);
    // ブラウザが空き容量不足のときに勝手に消さないよう、永続保存を申請する
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  } catch {
    state.storeError = "このブラウザでは端末に記録を保存できません（プライベートブラウズ中などの可能性があります）。";
  }
  state.loaded = true;
  render();
  if (meta.get("termsAgreed") !== TERMS_VER) showTerms(true);
  renderSyncInfo();
  // 同期：自動の端末は開いたときに読み込む。つなぎ直しが要るときは、前に許可していれば画面を出さずにつなぎ直す（1回だけ）
  const autoSync = syncOn() && canSync() && syncAuto();
  let tried = false; try { tried = sessionStorage.getItem("kuwagata:silentTried") === "1"; } catch {}
  const silent = autoSync && !syncReady() && meta.get("syncConsented") === "1" && !tried && navigator.onLine;
  // QRから開いたとき：Googleへつなぎ直しに行くなら、画面はまだ開かない（戻ってきてから開く）。
  // 先に開くと、Googleへ移ったときに消えて、QRを2回読まないと開かなかった（2026-11-23 直した）
  if (!silent) {
    state.routeWait = !runRoute(!(autoSync && syncReady()));
    // 同期が動かなかったときのために、少し待ってからもう一度ためす
    if (state.routeWait) setTimeout(() => { if (state.routeWait && !state.sync.busy) { state.routeWait = false; runRoute(true); } }, 8000);
  }
  if (autoSync) {
    if (syncReady()) syncNow();
    else if (silent) syncConnect(true);
  }
  // すでに開いているページで、別のQRを読んだとき（アドレスの # だけが変わる）
  window.addEventListener("hashchange", () => { takeRoute(); if (state.loaded) runRoute(true); });
})();
</script>
</body>
