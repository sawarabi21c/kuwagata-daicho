<style>
/* Layout: 1カラムの台帳。上に状況サマリー、下に菌糸瓶ラベル風の個体リスト。個体を開くと右（スマホは全面）から詳細パネル */
:root {
  --bg: #eef0ec;
  --surface: #ffffff;
  --surface-2: #f6f7f4;
  --ink: #1a1e1b;
  --muted: #5d6860;
  --line: #d6dbd3;
  --accent: #26402f;      /* 黒光りする甲の深緑 */
  --accent-ink: #ffffff;
  --amber: #a8620f;       /* 樹液の琥珀 */
  --amber-soft: #f6e7d2;
  --pupa: #6b4fa0;
  --pupa-soft: #ebe5f4;
  --adult-soft: #dde8df;
  --warn: #b54708;
  --warn-soft: #fdead7;
  --danger: #b42318;
  --danger-soft: #fbe4e1;
  --dead-soft: #e7e8e6;
  --shadow: 0 10px 30px rgba(20, 30, 22, .14);
  --f-display: "Dela Gothic One", "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --f-data: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111412; --surface: #1a1e1b; --surface-2: #20251f; --ink: #e6eae4; --muted: #98a39b; --line: #2d342f;
    --accent: #9cc4a8; --accent-ink: #10150f; --amber: #e4a24e; --amber-soft: #3a2a14; --pupa: #b9a2e6; --pupa-soft: #2d2540;
    --adult-soft: #22332a; --warn: #f0a060; --warn-soft: #3b2412; --danger: #f08a7e; --danger-soft: #3d1c18; --dead-soft: #272a28;
    --shadow: 0 10px 30px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
.wrap { max-width: 1040px; margin: 0 auto; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 22px; }
.num { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

/* header */
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(26px, 5vw, 36px); line-height: 1.1; margin: 0; letter-spacing: .02em; text-wrap: balance; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; font-weight: 500; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.btn.primary:hover { filter: brightness(1.1); }
.btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
.btn.danger.solid { background: var(--danger); color: var(--surface); }
.btn.small { padding: 4px 10px; font-size: 13px; }

.notice { padding: 10px 14px; border-radius: 8px; background: var(--warn-soft); color: var(--warn); font-size: 13px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }

/* summary */
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px; }
.stages { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.stage-cell { background: var(--surface); padding: 12px 14px; display: grid; gap: 2px; }
.stage-cell .label { font-size: 12px; color: var(--muted); letter-spacing: .08em; }
.stage-cell .value { font-family: var(--f-data); font-size: 26px; font-weight: 600; line-height: 1.1; }
.stage-cell .value small { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 2px; }
.stage-cell .sexcount { font-size: 13px; color: var(--muted); font-weight: 400; margin-left: 8px; letter-spacing: 0; white-space: nowrap; display: inline-block; }
.due { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; align-content: start; }
.due h2, .section-title { font-size: 13px; letter-spacing: .1em; color: var(--muted); margin: 0; font-weight: 700; }
.due ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.due li button { width: 100%; display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; text-align: left; border: 0; background: var(--surface-2); padding: 7px 10px; border-radius: 6px; }
.due li button:hover { background: var(--amber-soft); }
.due .empty { color: var(--muted); font-size: 13px; }
.tag { font-family: var(--f-data); font-size: 12px; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.tag.over { background: var(--danger-soft); color: var(--danger); font-weight: 600; }
.tag.soon { background: var(--warn-soft); color: var(--warn); }

/* toolbar */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .num { font-size: 11px; opacity: .7; margin-left: 4px; }
.search { flex: 1 1 200px; max-width: 280px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; }

/* list: 菌糸瓶ラベル風 */
.list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.list-more { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: center; padding: 8px 0 4px; }
.pick-note { margin: 4px 0 0; }
.card { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 0; display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; transition: transform .15s ease, box-shadow .15s ease; }
.card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px dashed var(--line); }
.card-code { font-family: var(--f-data); font-weight: 600; font-size: 16px; letter-spacing: .03em; overflow-wrap: anywhere; }
.card-body { padding: 10px 14px; display: grid; gap: 10px; min-width: 0; }
.card-body.has-thumb { grid-template-columns: minmax(0, 1fr) auto; align-items: center; }
.card-species { font-weight: 700; font-size: 16px; }
.card-meta { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.card-thumb { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; }
.card-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 14px; background: var(--surface-2); font-size: 13px; }
.card-foot .big { font-family: var(--f-data); font-weight: 600; font-size: 15px; }
.sex { font-weight: 700; margin-left: 4px; }
.sex.m { color: #2f6db5; } .sex.f { color: #c0426b; }
.pill { font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; white-space: nowrap; }
.pill.g-larva { background: var(--amber-soft); color: var(--amber); }
.pill.g-pupa { background: var(--pupa-soft); color: var(--pupa); }
.pill.g-adult { background: var(--adult-soft); color: var(--accent); }
.pill.g-dead { background: var(--dead-soft); color: var(--muted); }
.empty-state { border: 1px dashed var(--line); border-radius: 10px; padding: 36px 20px; text-align: center; color: var(--muted); display: grid; gap: 10px; justify-items: center; }

/* panel */
.overlay { position: fixed; inset: 0; background: rgba(10, 14, 11, .45); z-index: 20; display: flex; justify-content: flex-end; }
.panel { background: var(--bg); width: min(600px, 100%); height: 100%; overflow-y: auto; box-shadow: var(--shadow); padding-top: calc(20px + env(safe-area-inset-top, 0px)); padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px)); padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; align-content: start; }
@media (prefers-reduced-motion: no-preference) { .panel { animation: slide .2s ease-out; } }
@keyframes slide { from { transform: translateX(24px); opacity: .6; } }
.panel-head { display: flex; justify-content: space-between; align-items: start; gap: 10px; }
.panel-head h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 24px; line-height: 1.2; }
.close { border: 0; background: transparent; font-size: 22px; line-height: 1; padding: 4px 8px; color: var(--muted); }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; }
dl.facts { display: grid; grid-template-columns: 7em 1fr; gap: 6px 12px; margin: 0; font-size: 14px; }
dl.facts dt { color: var(--muted); }
dl.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.photo img { width: 100%; max-height: 320px; object-fit: cover; border-radius: 10px; display: block; }
.sibs { display: flex; flex-wrap: wrap; gap: 6px; }
.sibs button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 6px; padding: 3px 9px; font-size: 13px; }
.chart svg { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { fill: var(--muted); font-family: var(--f-data); font-size: 10px; }
.chart .area { fill: var(--amber); opacity: .12; }
.chart .line { fill: none; stroke: var(--amber); stroke-width: 2; }
.chart .dot { fill: var(--surface); stroke: var(--amber); stroke-width: 2; }
.chart .dot.last { fill: var(--amber); }
.chart .pt { fill: var(--ink); font-family: var(--f-data); font-size: 10px; }
.logs { list-style: none; margin: 0; padding: 0; display: grid; }
.logs li { display: grid; grid-template-columns: 6.5em minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px; }
.logs li:first-child { border-top: 0; }
.logs .state { font-weight: 700; font-size: 13px; }
.logs .meas { font-family: var(--f-data); font-size: 13px; }
.logs .note { display: block; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.logs .del { border: 0; background: transparent; color: var(--muted); font-size: 12px; }

form { display: grid; gap: 12px; }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; }
.fields .wide { grid-column: 1 / -1; }
.fields .group { grid-column: 1 / -1; font-size: 12px; font-weight: 700; color: var(--amber); letter-spacing: .1em; border-bottom: 1px solid var(--line); padding-bottom: 2px; margin-top: 6px; }
.fields .pair { display: grid; grid-template-columns: minmax(0, 1fr) 9em; gap: 6px; }
.xrow { grid-column: 1 / -1; display: grid; grid-template-columns: 2.6em repeat(4, minmax(0, 1fr)); gap: 6px; align-items: end; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.xrow .xno { font-family: var(--f-data); font-weight: 600; color: var(--amber); font-size: 13px; align-self: center; grid-row: span 2; }
.xrow .xnote { grid-column: span 1; }
.tbl.growth th[scope], .tbl.growth tbody th { text-align: left; white-space: nowrap; font-weight: 700; color: var(--ink); font-size: 13px; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.tbl.growth td { white-space: nowrap; }
.xrow input, .xrow select { font-size: 14px; padding: 6px 8px; }
@media (max-width: 480px) {
  .xrow { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .xrow .xno { grid-row: auto; grid-column: 1 / -1; }
}
label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); letter-spacing: .04em; }
input, select, textarea { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 10px; font-size: 15px; width: 100%; min-width: 0; letter-spacing: 0; }
textarea { min-height: 70px; resize: vertical; }
.unit { position: relative; display: grid; }
.unit input { padding-right: 2.8em; }
.unit[data-unit="℃・日"] input { padding-right: 4.2em; }
.unit::after { content: attr(data-unit); position: absolute; right: 9px; bottom: 9px; font-size: 12px; color: var(--muted); pointer-events: none; letter-spacing: 0; }
.photo-edit { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.photo-edit img { width: 88px; height: 66px; object-fit: cover; border-radius: 6px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row.end { justify-content: flex-end; }
.confirm { background: var(--danger-soft); color: var(--danger); border-radius: 8px; padding: 10px 12px; display: grid; gap: 8px; font-size: 14px; }
.confirm.neutral { background: var(--amber-soft); color: var(--ink); }
.pill.lock { background: var(--amber-soft); color: var(--amber); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 8px; font-size: 14px; z-index: 30; }
.hint { color: var(--muted); font-size: 12px; margin: 0; }
.terms { position: fixed; inset: 0; background: rgba(10, 14, 11, .55); z-index: 40; display: flex; align-items: center; justify-content: center; padding: 16px; }
.terms-box { background: var(--bg); width: min(640px, 100%); max-height: 100%; overflow-y: auto; border-radius: 12px; box-shadow: var(--shadow); padding: 20px; display: grid; gap: 12px; }
.terms-box h2 { margin: 0; font-size: 18px; }
.terms-box h3 { margin: 6px 0 0; font-size: 15px; }
.terms-box p, .terms-box ul { margin: 0; font-size: 14px; line-height: 1.7; }
.terms-box ul { padding-left: 1.3em; }
.backup-actions { display: grid; gap: 8px; }
.backup-actions .btn { text-align: left; display: grid; gap: 2px; }
.backup-actions .btn small { color: var(--muted); font-weight: 400; font-size: 12px; }
.btn.primary small { color: inherit; opacity: .8; }
/* tabs */
.tabs { display: flex; flex-wrap: wrap; gap: 0 4px; border-bottom: 1px solid var(--line); } /* 入りきらないタブは下の段に回す */
.tab { white-space: nowrap; }
.warn-num { color: var(--warn); font-weight: 700; }
.tbl-wrap { overflow-x: auto; }
.due li.due-act button { display: inline-block; width: auto; background: var(--surface); border: 1px solid var(--line); padding: 4px 12px; }
.due li.due-act button:hover { border-color: var(--muted); background: var(--surface); }
.bulk-tbl td { vertical-align: middle; }
.bulk-tbl select { width: auto; font-size: 13px; padding: 5px 6px; }
.bulk-tbl .bk-w { width: 6.5em; font-size: 14px; padding: 5px 2em 5px 8px; }
.bulk-tbl .unit::after { bottom: 7px; }
.bk-name { display: inline; font-size: 14px; color: var(--ink); letter-spacing: 0; cursor: pointer; }
.beetle-tbl th.pad { padding: 8px; font-size: 12px; color: var(--muted); font-weight: 500; }
.sale-list { max-height: 48vh; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
.sale-list thead th { position: sticky; top: 0; background: var(--surface); }
.list.as-table { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.beetle-tbl { font-size: 13.5px; }
.beetle-tbl th { padding: 0; position: sticky; top: 0; background: var(--surface); }
.beetle-tbl td { white-space: nowrap; vertical-align: middle; }
/* 長くなる文字の列（種別・産地・えさ）は折り返して、表を画面の幅に収める */
.beetle-tbl td.w { white-space: normal; min-width: 5.5em; overflow-wrap: anywhere; }
.list.as-table .beetle-tbl td { padding: 7px 6px; }
.list.as-table .th-sort { padding: 8px 6px; }
/* 表で見ているときは、広い画面なら横幅を広げる */
.wrap:has(#viewBeetles:not([hidden]) .list.as-table) { max-width: 1280px; }
.beetle-tbl tbody tr { cursor: pointer; }
.beetle-tbl tbody tr:hover td { background: var(--surface-2); }
.beetle-tbl .strong { font-weight: 600; }
.th-sort { border: 0; background: transparent; padding: 8px; width: 100%; text-align: inherit; font: inherit; font-size: 12px; color: var(--muted); white-space: nowrap; }
.th-sort:hover { color: var(--ink); }
th[aria-sort="ascending"] .th-sort, th[aria-sort="descending"] .th-sort { color: var(--ink); font-weight: 700; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 5px 14px; font-size: 13px; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 500; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .r { text-align: right; white-space: nowrap; }
.tbl .c { text-align: center; white-space: nowrap; }
.tbl tr.sel td { background: var(--amber-soft); }
.tbl tr.dim td { color: var(--muted); }
.tbl tr.low td { background: var(--warn-soft); }

/* 状態によって出す欄を変える（改善⑨）：成虫は幼虫の欄を隠し、次回交換予定は幼虫・卵だけ */

/* 累代票 */

.sheet-foot { font-size: 7.5pt; color: #5d6860; display: flex; justify-content: space-between; }

.sheet.ped { width: 190mm; max-width: none; height: 128mm; min-height: 0; padding: 0; gap: 0; border-radius: 0; grid-template-rows: auto auto 1fr; overflow: hidden; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

.ped-tbl td .unit input { width: 6.5em; padding-right: 2.6em; }
.ped-tbl tr.ped-gen th { background: var(--surface-2); color: var(--muted); font-weight: 700; }
/* 個体ラベル：A4の端から7mmの余白をとり、その内側を2列×5段に等分（1枚 98×56.6mm）。
   家庭用プリンターは紙の端3〜5mmが刷れないので、端いっぱいは使わない。普通紙に刷って点線で切る */
.lbl-page { width: 210mm; height: 297mm; padding: 7mm; display: grid; grid-template-columns: repeat(2, 98mm); grid-template-rows: repeat(5, 56.6mm); background: #fff; color: #1a1e1b; overflow: hidden; }
.lbl { padding: 3mm 4mm; border: .2mm dashed #b9c0b8; overflow: hidden; display: grid; gap: .9mm; align-content: start; font-family: var(--f-body); font-size: 8pt; line-height: 1.25; }
.lbl.blank { border-color: #e3e6e1; }
.lbl-head { display: flex; align-items: baseline; gap: 2mm; border-bottom: .35mm solid #1a1e1b; padding-bottom: .8mm; }
.lbl-name { font-family: var(--f-data); font-weight: 600; font-size: 12pt; letter-spacing: .02em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lbl-sex { font-weight: 700; font-size: 12pt; }
/* 成虫は、性別の右に大きさ（2026-11-24 あっきーさんの希望） */
.lbl-size { font-family: var(--f-data); font-weight: 700; font-size: 12pt; white-space: nowrap; }
/* 見出しの行が長いときに、ラベルの幅を押し広げてQRの下にもぐらないようにする（はみ出す分は右の小さい文字から「…」で省く） */

.lbl-head { min-width: 0; }

.lbl-sex.m { color: #2f6db5; } .lbl-sex.f { color: #c0426b; }

.lbl-sp { font-weight: 700; font-size: 8.6pt; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lbl-par { display: grid; grid-template-columns: 1fr 1fr; gap: 2mm; font-family: var(--f-data); font-size: 7.4pt; }
.lbl-par span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.lbl-ex th, .lbl-ex td { border: .2mm solid #8a948c; padding: 0 .8mm; height: 3.95mm; text-align: center; font-weight: 400; font-family: var(--f-data); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lbl-ex td.l { text-align: left; font-family: var(--f-body); }
.lbl-ex th { color: #3d4640; font-family: var(--f-body); font-size: 6.6pt; text-align: left; }
.lbl-ex tr.hd th { height: 3.2mm; color: #5d6860; font-size: 6.2pt; text-align: center; }
.lbl-ex .k { color: #5d6860; font-size: 6.4pt; margin-right: 1mm; }
.lbl-preview { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: #fff; }
.lbl-preview .lbl-scale { transform-origin: top left; }
/* 販売用の印刷物（5回目：販売用ラベル・飼育記録シート・売り物の一覧・販売札）。ブランドは黒×金、ロゴ画像は種類の登録で読み込む */
.brand-logo { width: 9mm; height: 9mm; object-fit: contain; flex: none; }
.brand-name { color: #9a7b16; font-weight: 700; letter-spacing: .04em; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.slb-head { display: flex; align-items: center; gap: 2mm; border-bottom: .35mm solid #1a1e1b; padding-bottom: .8mm; }
.slb-head .brand-name { margin-left: auto; font-size: 7.5pt; white-space: nowrap; }
.slb-head .brand-logo { width: 7mm; height: 7mm; }
.slb-big { display: flex; gap: 6mm; }
.slb-big div { display: grid; }
.slb-big .k, .care .k, .stag .k, .slist .k { color: #5d6860; font-size: 7pt; font-weight: 400; }
.slb-big .v { font-family: var(--f-data); font-weight: 600; font-size: 17pt; line-height: 1.1; }
.slb-sub { font-size: 7.6pt; color: #3d4640; }
.sheet.ped.care { padding: 3mm 4mm; display: grid; gap: 1.6mm; grid-template-rows: auto auto auto 1fr auto; font-size: 8.5pt; } /* 余った高さはメモ欄（手書き用）にする */

.care-head .brand-logo { width: 12mm; height: 12mm; }
.care-title { font-weight: 700; font-size: 12pt; }
.care-grid { display: grid; grid-template-columns: 1fr 1.25fr; gap: 3mm; }
.care table, .slist table { width: 100%; border-collapse: collapse; }
.care th, .care td { border: .2mm solid #8a948c; padding: .3mm 1.2mm; text-align: left; font-weight: 400; font-size: 7.6pt; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.care th { color: #5d6860; }
.care-memo { border: .2mm solid #8a948c; min-height: 12mm; padding: 1mm 1.5mm; color: #5d6860; font-size: 7pt; }

.slist-head .brand-logo { width: 14mm; height: 14mm; }
.slist th, .slist td { border: .25mm solid #8a948c; padding: 1.2mm 2mm; text-align: left; font-weight: 400; vertical-align: middle; }
.slist th { color: #5d6860; font-size: 8.5pt; }
.slist td.price, .slist th.price { text-align: right; white-space: nowrap; }
.slist td.price { font-size: 13pt; font-weight: 700; font-family: var(--f-data); }

.stag { padding: 3mm 4mm; border: .2mm dashed #b9c0b8; overflow: hidden; display: grid; gap: .8mm; align-content: start; font-family: var(--f-body); font-size: 8pt; line-height: 1.25; }
.stag.blank { border-color: #e3e6e1; }

.stag-size { font-family: var(--f-data); font-weight: 600; font-size: 15pt; }

.stag-price .v { font-family: var(--f-data); font-weight: 700; font-size: 22pt; }
.sp-row.grp td { background: var(--surface-2); }
.sp-price { width: 8.5em; }
.tree-wrap { overflow-x: auto; }
.tree { display: grid; min-width: max-content; font-size: 13px; }
.tree-cell { border-right: 1px solid var(--line-strong, #8a948c); border-bottom: 1px solid var(--line); padding: 2px 8px; display: flex; flex-wrap: wrap; align-items: center; align-content: center; gap: 0 4px; min-width: 0; }

.set-row { grid-column: 1 / -1; display: grid; grid-template-columns: 2.6em repeat(3, minmax(0, 1fr)); gap: 6px; align-items: end; padding: 8px 0; border-bottom: 1px dashed var(--line); }

@media (max-width: 560px) { .set-row { grid-template-columns: repeat(2, minmax(0, 1fr)); } .set-row .xno { grid-row: auto; grid-column: 1 / -1; } .set-row .set-setup { grid-column: 1 / -1; } }
/* ペアのラベル：A4を2列×8段（1枚 98×35.4mm）。端は7mm空ける */
.plbl-page { grid-template-rows: repeat(8, 35.375mm); }
.plbl { padding: 1.6mm 2.5mm; border: .2mm dashed #b9c0b8; overflow: hidden; display: grid; gap: .8mm; align-content: start; font-family: var(--f-body); font-size: 7.4pt; line-height: 1.2; }
.plbl.blank { border-color: #e3e6e1; }

.plbl th, .plbl td { border: .3mm solid #1a1e1b; height: 3.9mm; padding: 0 1mm; text-align: center; font-family: var(--f-data); font-weight: 400; white-space: nowrap; overflow: hidden; }
.plbl th { font-family: var(--f-body); font-weight: 700; font-size: 6.6pt; }
.plbl tr.hd th { font-size: 6.2pt; padding: 0 .5mm; }
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 10px; }

.ph figcaption input, .ph figcaption select { font-size: 12px; padding: 3px 6px; width: auto; flex: 1 1 7em; }
.sub.sync-warn { color: var(--danger); font-weight: 700; }
/* QRコード */
.qr { display: block; width: 100%; height: auto; }
.lbl { position: relative; }
.lbl-qr { position: absolute; top: 2.6mm; right: 3.4mm; width: 13mm; }

<script>
// 版の切り替え：あっきーさん用は "main"。ベータ版のファイル（kuwagata-daicho-beta.html）は、この1行だけ "beta" にしたコピー
const EDITION = "main";

const stageGroup = s => !s ? "larva" : s === "卵" || s.startsWith("幼虫") ? "larva" : s === "前蛹" || s === "蛹" ? "pupa" : s === "成虫" ? "adult" : s === "死亡" ? "dead" : "larva";
// 死亡・販売・譲渡した個体は「履歴」に分ける
const ARCHIVE_REASONS = ["死亡", "販売", "譲渡"];
// 「記録なし」：長く更新のない個体を、確認してから履歴へ移したもの（改善④）

const FILTERS = [

  { key: "larva", label: "幼虫・卵", test: b => !isArchived(b) && stageGroup(b.stage) === "larva" },
  { key: "pupa", label: "前蛹・蛹", test: b => !isArchived(b) && stageGroup(b.stage) === "pupa" },

const PAIR_STATUSES = ["同居中", "産卵セット中", "割り出し済", "終了"];
const WORKS = ["えさ交換", "体重測定", "マット交換", "割り出し", "メモ"];
const STATUSES = ["飼育中", "ペアリング中", "産卵セット中", "出品中", "譲渡済", "販売済"];
const DEFAULTS = {

  container: ["800cc", "1100cc", "1400cc", "2000cc", "3000cc"],
  collectState: ["成虫", "幼虫", "材割り"],

};

const MASTER_KINDS = [
  { key: "species", label: "クワガタの種類", hint: "種別の欄に出ます", placeholder: "例 オオクワガタ" },

  { key: "rank", label: "ランク", hint: "ランクの欄の候補に出ます", placeholder: "例 S" },

const fmtCont = v => v && /^\d+(\.\d+)?$/.test(String(v)) ? v + "cc" : (v || "");
// 「表示する項目」（改善⑯）：使わない欄を隠せる。隠しても記録は消さない。名前・種別・状態・えさ交換の記録はいつも出す
const FIELDS = [
  { key: "sex", label: "性別", group: "基本" }, { key: "line", label: "累代", group: "基本" }, { key: "locality", label: "産地", group: "基本" },
  { key: "breeder", label: "ブリーダー", group: "基本" }, { key: "status", label: "現状", group: "基本" }, { key: "rank", label: "ランク", group: "基本" },
  { key: "parents", label: "♂親・♀親", group: "親・血統" }, { key: "parentBreeder", label: "親のブリーダー", group: "親・血統" }, { key: "pedigree", label: "血統（祖父母・曽祖父母）", group: "親・血統" },
  { key: "hatchDate", label: "孵化日", group: "成長の記録" }, { key: "harvestDate", label: "割り出し日", group: "成長の記録" },
  { key: "pupationDate", label: "蛹化日", group: "成長の記録" }, { key: "pupaWeight", label: "蛹化時の体重", group: "成長の記録" },
  { key: "eclosionDate", label: "羽化日", group: "成長の記録" }, { key: "sizeMm", label: "大きさ（体長）", group: "成長の記録" },
  { key: "headWidth", label: "頭幅", group: "成長の記録" }, { key: "jaw", label: "あご", group: "成長の記録" },
  { key: "feedStartDate", label: "後食開始日", group: "成虫" }, { key: "adultFood", label: "成虫のえさ", group: "成虫" }, { key: "adultCase", label: "ケース", group: "成虫" },
  { key: "feeding", label: "飼育方法（えさ）・容器", group: "飼育" }, { key: "nextChange", label: "次回交換予定とお知らせ", group: "飼育" },
  { key: "storage", label: "保管場所", group: "飼育" }, { key: "cumTemp", label: "積算温度", group: "飼育" },
  { key: "collectDate", label: "採集日", group: "採集" }, { key: "collectState", label: "採集時状態", group: "採集" }, { key: "collectPlace", label: "採集場所", group: "採集" },

// 採集の項目は、ふだんは隠す（改善⑮）
const DEFAULT_HIDDEN = ["collectDate", "collectState", "collectPlace"];
const isHidden = k => (state.masters.hiddenFields || DEFAULT_HIDDEN).includes(k);
// 幼虫・卵のときだけ使う項目（次回交換予定・自動計算・まとめて交換）と、成虫のときだけの項目（改善⑨）
const isLarva = b => stageGroup(b.stage) === "larva";
const isAdult = b => stageGroup(b.stage) === "adult";

// 一覧に一度に出す頭数、個体を選ぶ表に一度に出す頭数、まとめてえさ交換の上限（2026-11-20 あっきーさんが500に決めた）
const LIST_PAGE = 500, PICK_MAX = 500;
const state = { view: "beetles", masters: { species: [], food: [], container: [], intervals: {}, defaultInterval: 90, breederName: "", hiddenFields: [...DEFAULT_HIDDEN], mixes: [], staleMonths: 12 }, beetles: [], pairs: [], money: [], stock: [], moneyYear: new Date().getFullYear(), moneyMonth: 0, listMode: "card", sort: { key: "code", dir: 1 }, species: "", lastShown: [], bulkIds: [], copyFrom: null, labelIds: [], pairLabelIds: [], listingIds: [], careIds: [], spIds: [], spGroups: [], spPrices: {}, spKind: "stock", lineSp: "",saleIds: [], saleTypeTouched: false, histFilter: "all", histQ: "", filter: "all", pairFilter: "active", q: "", openId: null, loaded: false, mode: "view", pendingImport: null, pendingUpdate: null, csvImp: null, csvMode: "beetles", draftImage: undefined, sheetIds: [], backTo: null };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const localDate = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => localDate();
const daysUntil = d => Math.round((new Date(d + "T00:00:00") - new Date(today() + "T00:00:00")) / 86400000);
const fmtDate = d => d ? d.replace(/-/g, ".") : "—";
const sexMark = s => s === "♂" ? '<span class="sex m">♂</span>' : s === "♀" ? '<span class="sex f">♀</span>' : "";
const nameOf = b => b.code || "(名前なし)";
// 日本語の並べ替え（数字は数として比べる）。localeCompare と同じ並びで、ずっと速い（2026-11-20）
const jaCmp = new Intl.Collator("ja", { numeric: true }).compare;
const byName = name => name ? state.beetles.find(b => b.code === name) : null;
const newId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

function latestWeight(b) {
  const w = (b.logs || []).filter(l => typeof l.weight === "number").sort((a, c) => a.date < c.date ? -1 : 1);
  return w.length ? w[w.length - 1] : null;
}
// 入力済みの値＋よく使う値を候補にする（自由入力もできる）
function options(field, extra = []) {
  const set = new Set([...(DEFAULTS[field] || []), ...extra]);
  state.beetles.forEach(b => { if (b[field]) set.add(String(b[field])); });
  state.pairs.forEach(p => { if (p[field]) set.add(String(p[field])); });
  return [...set].map(v => `<option value="${esc(v)}">`).join("");
}
// 登録した種類から選ぶ欄。一覧にない古い値は「（未登録）」として残す
function masterSelect(id, kind, value, attrs = "") {
  const list = state.masters[kind] || [];
  const cur = kind === "container" ? fmtCont(value) : value || "";
  const opts = [...list];
  if (cur && !opts.includes(cur)) opts.unshift(cur);
  return `<select id="${id}" data-master="${kind}" ${attrs}><option value="">${kind === "species" ? "選んでください" : "—"}</option>${opts.map(o => `<option value="${esc(o)}"${o === cur ? " selected" : ""}>${esc(o)}${list.includes(o) ? "" : "（未登録）"}</option>`).join("")}</select>`;
}
function setSelect(el, v) {
  if (v && ![...el.options].some(o => o.value === v)) el.add(new Option(v + "（未登録）", v));
  el.value = v;
}
// 累代・ランクの候補：種類の登録で決めた一覧（無ければ よく使う値＋入力済みの値）
function seedList(k) {
  const set = new Set(DEFAULTS[k] || []);
  state.beetles.forEach(b => { if (b[k]) set.add(String(b[k])); });
  if (k === "line") state.pairs.forEach(p => { if (p.childLine) set.add(String(p.childLine)); });
  return [...set];
}
const masterOptions = k => (Array.isArray(state.masters[k]) ? state.masters[k] : seedList(k)).map(v => `<option value="${esc(v)}">`).join("");
// 初回は、よく使う種類と今までに入力した値で一覧を作る
function seedMasters() {
  const add = (set, v) => { if (v) set.add(String(v)); };
  const sp = new Set(DEFAULTS.species), fd = new Set(DEFAULTS.feeding), ct = new Set(DEFAULTS.container);
  state.beetles.forEach(b => {
    add(sp, b.species); add(fd, b.feeding); add(ct, fmtCont(b.container));
    (b.logs || []).forEach(l => { add(fd, l.food); add(ct, fmtCont(l.container)); });
  });

async function saveMasters(stamp = true) {
  if (stamp) state.masters.updatedAt = new Date().toISOString();
  try { await store.put({ id: "masters", ...state.masters }, "settings"); }
  catch { toast("保存できませんでした"); return false; }
  return true;
}
function siblings(b) {
  if (!b.fatherName && !b.motherName) return [];
  return state.beetles.filter(x => x.id !== b.id && x.fatherName === b.fatherName && x.motherName === b.motherName);
}
function childrenOf(p) {
  return state.beetles.filter(b => b.pairId === p.id || (!b.pairId && p.maleName && p.femaleName && b.fatherName === p.maleName && b.motherName === p.femaleName))
    .sort((a, c) => jaCmp(a.code || "", c.code || ""));
}
// 親の累代から子の累代を出す（WD→WF1、WF1→WF2、CBF1→CBF2、CB→CBF1）
function parseLine(l) {
  const s = String(l || "").toUpperCase().replace(/\s/g, "");
  if (s === "WD") return { p: "WF", n: 0 };
  if (s === "CB") return { p: "CBF", n: 0 };
  const m = s.match(/^(WF|CBF|F)(\d+)$/);
  return m ? { p: m[1] === "F" ? "CBF" : m[1], n: +m[2] } : null;

function childLine(a, b) {
  const x = parseLine(a), y = parseLine(b);
  if (!x && !y) return "";
  const list = [x, y].filter(Boolean);
  const p = list.some(v => v.p === "CBF") ? "CBF" : "WF";
  return p + (Math.max(...list.map(v => v.n)) + 1);
}

// 印刷（2026-11-23）：iPhoneのSafariは、文字（ウェブフォント）の読み込み中に印刷を頼むと止まるので、読み込みを待ってから頼む。
// 印刷のあいだは、プレビューの作り直し（watchPreview）を止める（作り直しが続くと、iPhoneで印刷の画面が出なかった）

// iPhone・iPadのSafariは「@page labels」（余白0の用紙）を使えず、ふつうの余白10mmの中に210mm幅のラベル用紙を入れようとして、

      catch (e) { if (e.auth) throw e; id = await d.find(); if (id) changed = await syncMerge(await d.read(id)); }
    }

    let ph = { got: 0, fail: 0 };

/* ---------- 写真の同期（2026-11-26） ----------

   記録のファイルには、個体ごとに photoRefs = { main: {h, date, kind}, list: [{id, h, date, kind}] }（どの写真があるか）だけを入れる。
   写真は足し合わせる：どちらかの端末にある写真は、両方に残る。消したときだけ「消した印」（tombstones の s: "photo"、id: 個体のid/写真の印）で消える。

const hashMemo = new Map();
const canHash = () => !!(window.crypto && crypto.subtle);

  if (!data || !canHash()) return "";

  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(data));
  const h = [...new Uint8Array(buf)].slice(0, 16).map(x => x.toString(16).padStart(2, "0")).join("");
  hashMemo.set(data, h);
  return h;
}
// 写真に印が無ければ付ける（記録の日時は変えない）
async function ensurePhotoHashes() {

async function addPhotoTomb(beetleId, h) {
  if (!h) return;
  const id = beetleId + "/" + h;
  state.tombs = [...state.tombs.filter(t => !(t.s === "photo" && t.id === id)), { s: "photo", id, at: new Date().toISOString() }];
  try { await store.tx("settings", "readwrite", s => { s.put({ id: "tombstones", list: state.tombs }); }); } catch {}
}
// 同じ写真を足し直したときは、消した印を「取り消し」（undo）に書き換える。
// 印を外すだけだと、ほかの端末やドライブに残っている印でまた消えるため、新しい日時の取り消しで上書きする
async function clearPhotoTombs(b) {
  const live = t => t.s === "photo" && !t.undo && t.id.startsWith(b.id + "/");
  if (!canHash() || !state.tombs.some(live)) return;
  const hs = new Set(await Promise.all(allPhotos(b).map(x => photoHash(x.data))));
  const at = new Date().toISOString();
  let n = 0;
  const next = state.tombs.map(t => live(t) && hs.has(t.id.slice(b.id.length + 1)) ? (n++, { s: "photo", id: t.id, at, undo: true }) : t);
  if (!n) return;
  state.tombs = next;
  try { await store.tx("settings", "readwrite", s => { s.put({ id: "tombstones", list: state.tombs }); }); } catch {}
}
// 届いた写真を個体に入れる
async function attachPhoto(id, w, data) {
  const b = state.beetles.find(x => x.id === id);
  if (!b || !(b.photoWait || []).some(x => x.h === w.h)) return;
  const nb = { ...b, photoWait: b.photoWait.filter(x => x.h !== w.h), photos: [...(b.photos || [])] };
  if (w.main || !nb.image) {
    if (nb.image) nb.photos.push({ id: newId("ph"), date: b.imageInfo?.date || "", kind: b.imageInfo?.kind || "", data: b.image, h: b.imageInfo?.n === b.image.length ? b.imageInfo?.h : undefined });
    nb.image = data; nb.imageInfo = { date: w.date || "", kind: w.kind || "", h: w.h, n: data.length };
  } else nb.photos.push({ id: w.id && w.id !== "main" ? w.id : newId("ph"), date: w.date || "", kind: w.kind || "", data, h: w.h });
  if (!nb.photoWait.length) delete nb.photoWait;
  await store.tx("beetles", "readwrite", s => { s.put(nb); });
  state.beetles = state.beetles.map(x => x.id === id ? nb : x);
}
// 送る・受け取る・使っていない写真をごみ箱へ。受け取った枚数を返す
async function syncPhotos() {
  const d = drive();
  if (!d.photoFolder || !canHash()) return { got: 0, fail: 0 };
  const folder = await d.photoFolder();
  const files = await d.photoList(folder);
  const byH = new Map();
  files.forEach(f => { const h = String(f.name || "").replace(/\.[a-z0-9]+$/i, ""); if (h && !byH.has(h)) byH.set(h, f); });
  const used = new Set(), up = [], upH = new Set();
  state.beetles.forEach(b => photoEntries(b).forEach(e => {
    if (!e.h) return;
    used.add(e.h);
    if (e.data && !byH.has(e.h) && !upH.has(e.h)) { up.push(e); upH.add(e.h); }
  }));
  const gets = [];
  state.beetles.forEach(b => (b.photoWait || []).forEach(w => { if (byH.has(w.h)) gets.push([b.id, w]); }));
  const total = up.length + gets.length;
  let done = 0, fail = 0, got = 0;
  const prog = () => { state.sync.photo = `写真を同期しています（${done}/${total}）`; renderSyncInfo(); };
  for (const e of up) {
    prog();
    try { const f = await d.photoUpload(folder, e.h + (/^data:image\/png/.test(e.data) ? ".png" : ".jpg"), e.data); byH.set(e.h, f || {}); }
    catch (er) { if (er.auth) throw er; fail++; }
    done++;
  }
  for (const [bid, w] of gets) {
    prog();
    try { const data = await d.photoRead(byH.get(w.h).id); hashMemo.set(data, w.h); await attachPhoto(bid, w, data); got++; }
    catch (er) { if (er.auth) throw er; fail++; }
    done++;
  }
  const cut = Date.now() - 86400000;
  for (const [h, f] of byH) {
    if (used.has(h) || !f.id || !f.createdTime || new Date(f.createdTime).getTime() >= cut) continue;
    try { await d.photoTrash(f.id); } catch (er) { if (er.auth) throw er; }
  }
  return { got, fail };
}

function renderNotice() {

  if (!state.beetles.length && !state.pairs.length) return n.hidden = true;

  if (age === null || age >= BACKUP_REMIND_DAYS) {
    n.innerHTML = `<span>${age === null ? "まだバックアップを取っていません。" : `最後のバックアップから${age}日たっています。`}ブラウザのデータを消すと記録も消えるので、ファイルに書き出しておきましょう。</span><button class="btn small" type="button" data-backup>バックアップする</button>`;

/* ---------- 次回交換日の自動計算 ---------- */
const intervalFor = food => Number(state.masters.intervals[food]) || Number(state.masters.defaultInterval) || 0;
const addDays = (d, n) => { const t = new Date(d + "T00:00:00"); t.setDate(t.getDate() + n); return localDate(t); };
const autoNext = (date, food) => { const n = intervalFor(food); return date && n ? addDays(date, n) : ""; };

/* ---------- 生体販売 ---------- */
const SALE_TYPES = ["単体販売", "ペア販売", "複数引き販売"];
// 同じ販売でまとめて売った、ほかの個体
const saleMates = b => b.archive?.groupId ? state.beetles.filter(x => x.id !== b.id && x.archive?.groupId === b.archive.groupId) : [];
// 選んだ頭数と性別から販売の形を決める（♂♀1頭ずつならペア）
function guessSaleType(list) {
  if (list.length <= 1) return "単体販売";
  if (list.length === 2 && list.some(b => b.sex === "♂") && list.some(b => b.sex === "♀")) return "ペア販売";
  return "複数引き販売";
}

// 売った個体の主な情報を収支の記録にも写しておく（個体を削除しても残るように）
const SOLD_KEYS = ["code", "species", "sex", "sizeMm", "line", "locality", "eclosionDate"];

   2026-11-20：個体が多いと重いので、最初はチェックした個体だけを出す。検索するか「全部出す」を押したら PICK_MAX 頭まで並べる。
   チェックした個体は、検索に合わなくてもいつも上に出す。 */
const pickKey = b => [b.code, b.species, b.line, b.locality].join(" ").toLowerCase();
function pickState(kind) { if (!state.pick || state.pick.kind !== kind) state.pick = { kind, q: "", all: false, stage: "" }; return state.pick; }

const PICK_STAGES = [["", "状態：すべて"], ["larva", "幼虫・卵"], ["pupa", "前蛹・蛹"], ["adult", "成虫"]];
function pickRows(kind, cands, picked, rowFn) {
  const p = pickState(kind), q = p.q.trim().toLowerCase(), st = p.stage || "", set = new Set(picked);
  const sel = cands.filter(b => set.has(b.id));
  const hit = p.all || q || st ? cands.filter(b => !set.has(b.id) && (!q || pickKey(b).includes(q)) && (!st || stageGroup(b.stage) === st)) : [];
  const rest = hit.slice(0, PICK_MAX);
  const note = !p.all && !q && !st ? `${cands.length}頭から選べます。名前・種別で検索するか、状態を選ぶか、<button class="btn small" type="button" data-pickall="${kind}">全部出す</button> を押してください。`
    : hit.length > rest.length ? `合う個体が${hit.length}頭あるので、${PICK_MAX}頭まで出しています。検索でしぼってください。`
    : (q || st) && !hit.length ? "検索に合う個体はありません。" : "";
  return { rows: sel.map(b => rowFn(b, true)).join("") + rest.map(b => rowFn(b, false)).join(""), note };
}

/* ---------- ラインごとの成績（改善⑩） ---------- */
// 「◯mm以上」の基準は種類ごと（種類の登録で決める。2026-11-19 から「超え」ではなく「以上」で、基準ちょうども数える）。決めていないタランドゥスは90mm
const sizeThreshold = sp => {
  const v = (state.masters.sizeThresholds || {})[sp];
  if (v !== undefined && v !== null && v !== "") return Number(v) || null;
  return !BETA && /タランドゥス/.test(sp || "") ? 90 : null;
};
const avgOf = a => a.length ? Math.round(a.reduce((s, x) => s + x, 0) / a.length * 10) / 10 : null;
// 同じ親の子（履歴に移した個体も数える。削除した個体は数えられない）の成績
function lineStats(kids, species) {
  const sized = sex => kids.filter(b => b.sex === sex && typeof b.sizeMm === "number" && b.sizeMm > 0).map(b => b.sizeMm);
  const m = sized("♂"), f = sized("♀"), th = sizeThreshold(species);
  return {
    total: kids.length,
    eclosed: kids.filter(b => b.eclosionDate || b.sizeMm || isAdult(b)).length,
    mN: m.length, mAvg: avgOf(m), mMax: m.length ? Math.max(...m) : null,
    fN: f.length, fAvg: avgOf(f), fMax: f.length ? Math.max(...f) : null,
    th, over: th ? m.filter(x => x >= th).length : null,
  };
}
const pct = (a, n) => n ? Math.round(a / n * 100) : 0;
// 成績を1行の文にする（ペア・個体の画面用）
function statsText(s) {
  if (!s.total) return "";
  return [`子${s.total}頭・羽化${s.eclosed}頭`,
    s.mN ? `♂${s.mN}頭 平均${s.mAvg}mm・最大${s.mMax}mm` : "",
    s.fN ? `♀${s.fN}頭 平均${s.fAvg}mm・最大${s.fMax}mm` : "",
    s.th && s.mN ? `${s.th}mm以上 ${s.over}頭（♂の${pct(s.over, s.mN)}％）` : ""].filter(Boolean).join(" ／ ");
}
// 親の組（♂親×♀親の名前）ごとにまとめる
function lineGroups() {
  const map = new Map();
  state.beetles.forEach(b => {
    if (!b.fatherName && !b.motherName) return;
    const k = (b.fatherName || "") + "\u0000" + (b.motherName || "");
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(b);
  });
  return [...map.values()].map(kids => {
    const b = kids[0], sp = b.species || "";
    const pair = state.pairs.find(p => p.maleName === b.fatherName && p.femaleName === b.motherName) || state.pairs.find(p => kids.some(k => k.pairId === p.id));
    const lines = [...new Set(kids.map(k => k.line).filter(Boolean))];
    return { kids, sp, father: b.fatherName, fSize: b.fatherSize, mother: b.motherName, mSize: b.motherSize, line: lines.join("・"), pair, s: lineStats(kids, sp) };
  });
}

// 最後に更新した日：保存した日（updatedAt）・登録日・記録の日付・孵化〜後食の日付のうち、いちばん新しい日
function lastUpdate(b) {
  const ds = [b.updatedAt, b.createdAt].filter(Boolean).map(s => String(s).slice(0, 10));
  ds.push(...(b.logs || []).map(l => l.date), b.hatchDate, b.harvestDate, b.pupationDate, b.eclosionDate, b.feedStartDate);
  return ds.filter(d => /^\d{4}-\d{2}-\d{2}$/.test(d || "")).sort().pop() || "";
}
const ACTIVE_PAIR = ["同居中", "産卵セット中"];
// 候補：飼育中で、保護（鍵）・ペアリング中・産卵セット中ではなく、設定の月数より前から更新のない個体。自動では移さない
function staleList() {
  const months = Number(state.masters.staleMonths) || 0;
  if (!months) return [];
  const c = new Date(today() + "T00:00:00"); c.setMonth(c.getMonth() - months);
  const cutoff = localDate(c);
  const inPair = new Set(state.pairs.filter(p => ACTIVE_PAIR.includes(p.status)).flatMap(p => [p.maleName, p.femaleName]).filter(Boolean));
  // 個体の「現状」がペアリング中・産卵セット中か、進行中のペア（同居中・産卵セット中）に名前がある個体は外す
  return state.beetles.filter(b => !isArchived(b) && !b.locked && !["ペアリング中", "産卵セット中"].includes(b.status) && !(b.code && inPair.has(b.code)))

    .sort((a, c) => a.last.localeCompare(c.last));
}

/* ---------- 添加剤の配合（改善③） ---------- */
// 配合は state.masters.mixes に { id, code（記号 ①など）, name, items: [{ additive, g }]（1ブロックあたり）, food, memo }。
// 交換の記録には記号を additive に、配合の id を mixId に入れる。一度使った配合は記号と中身を変えない
const mixes = () => state.masters.mixes || [];
const CIRCLED = "①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳";
function nextMixCode() {
  const used = new Set(mixes().map(m => m.code));
  return [...CIRCLED].find(c => !used.has(c)) || `配合${mixes().length + 1}`;
}
const mixIdFor = code => code ? mixes().find(m => m.code === code)?.id || "" : "";
// 交換の記録で、この配合を使った回数（古い記録は記号で数える）
const mixUses = id => {
  const m = mixes().find(x => x.id === id);
  return m ? state.beetles.reduce((n, b) => n + (b.logs || []).filter(l => l.mixId === id || (!l.mixId && l.additive === m.code)).length, 0) : 0;
};
const mixText = m => (m.items || []).map(i => `${i.additive}${i.g !== null && i.g !== undefined && i.g !== "" ? " " + i.g + "g" : ""}`).join("・");
const mixCopy = src => ({ code: nextMixCode(), name: src.name || "", items: structuredClone(src.items || []), food: src.food || "", memo: src.memo || "" });
// 交換の記録の「添加剤・配合」の欄。配合と、今までの1つだけの添加剤の両方から選べる
function additiveSelect(id, value) {
  const ms = mixes(), adds = state.masters.additive || [];
  const known = ms.some(m => m.code === value) || adds.includes(value);
  return `<select id="${id}" data-master="additive"><option value="">—</option>
    ${value && !known ? `<option value="${esc(value)}" selected>${esc(value)}（未登録）</option>` : ""}
    ${ms.length ? `<optgroup label="配合">${ms.map(m => `<option value="${esc(m.code)}"${m.code === value ? " selected" : ""}>${esc(m.code)} ${esc(m.name || "")}</option>`).join("")}</optgroup>` : ""}
    ${adds.length ? `<optgroup label="添加剤（1つだけ）">${adds.map(a => `<option value="${esc(a)}"${a === value && !ms.some(m => m.code === value) ? " selected" : ""}>${esc(a)}</option>`).join("")}</optgroup>` : ""}
  </select>`;
}
// 記録に配合の id を付ける（配合でなければ外す）
function withMix(entry) {
  const id = mixIdFor(entry.additive);
  if (id) entry.mixId = id; else delete entry.mixId;
  return entry;
}

const TITLE_MAX = 65;

const isNewAdult = b => { if (!isAdult(b) || !b.eclosionDate) return false; const c = new Date(today() + "T00:00:00"); c.setMonth(c.getMonth() - 6); return b.eclosionDate >= localDate(c); };
const bySex = list => [...list].sort((a, c) => (a.sex === "♂" ? 0 : a.sex === "♀" ? 1 : 2) - (c.sex === "♂" ? 0 : c.sex === "♀" ? 1 : 2));
const sexLabel = b => b.sex === "♂" || b.sex === "♀" ? b.sex : "";
const sameAll = (list, f) => list.length && list.every(b => f(b) === f(list[0])) ? f(list[0]) : null;

function listingTitle(list, opt) {
  const l = bySex(list);
  const size = l.map(b => `${typeof b.sizeMm === "number" ? b.sizeMm + "mm" : ""}${sexLabel(b)}`).filter(Boolean).join("×");
  const kind = l.length === 2 && l.some(b => b.sex === "♂") && l.some(b => b.sex === "♀") ? "ペア" : l.length > 1 ? `${l.length}頭セット` : "";
  const sp = [...new Set(l.map(b => b.species).filter(Boolean))].join("・");
  const line = sameAll(l, b => b.line || "");
  const par = sameAll(l, b => `${b.fatherSize ?? ""}|${b.motherSize ?? ""}`);
  const [fs, ms] = par ? par.split("|") : ["", ""];
  const seg = [[size, kind].filter(Boolean).join(" "), sp, line, opt.newAdult ? "新成虫" : "",
    fs || ms ? `種親${fs ? "♂" + fs : ""}${fs && ms ? "×" : ""}${ms ? "♀" + ms : ""}` : "", sameAll(l, b => b.locality || ""), brandText()].filter(Boolean);
  while (seg.length > 2 && seg.join(" ").length > TITLE_MAX) seg.pop();
  return seg.join(" ").slice(0, TITLE_MAX);
}
// 《種類》〜《産地》の行。記録の無い行は省く
function listingBlock(list) {
  const l = bySex(list);
  const per = (f, fmt) => l.filter(b => f(b)).map(b => `${l.length > 1 ? sexLabel(b) : sexLabel(b)}${fmt(f(b))}`).join(" ");
  const one = (f) => { const v = sameAll(l, b => f(b) || ""); return v !== null ? v : l.map(b => `${sexLabel(b)}${f(b) || "—"}`).join(" "); };
  const parOf = b => [b.fatherSize ? "♂" + b.fatherSize + "mm" : "", b.motherSize ? "♀" + b.motherSize + "mm" : ""].filter(Boolean).join(" ");
  const parSame = sameAll(l, parOf);
  const rows = [
    ["種類", [...new Set(l.map(b => b.species).filter(Boolean))].join("・")],
    ["サイズ", per(b => typeof b.sizeMm === "number" ? b.sizeMm : null, v => v.toFixed(1) + "mm")],
    ["羽化日", per(b => b.eclosionDate, jpDate)],

    ["産地", l.some(b => b.locality) ? one(b => b.locality) : ""],

// えさ交換で使った分を在庫から減らす。uses は {food, container} の配列
async function useStock(uses) {
  const changed = new Map();
  uses.forEach(u => state.stock.forEach(s => {
    if (!s.link) return;
    const hit = (s.link === "container:" + u.container && u.container) || (s.link === "food:" + u.food && u.food);
    if (hit) { s.qty = Math.max(0, (Number(s.qty) || 0) - 1); changed.set(s.id, s); }
  }));
  if (!changed.size) return "";
  try { await store.putMany([...changed.values()], "stock"); } catch { return "在庫を減らせませんでした"; }
  return "在庫 " + [...changed.values()].map(s => `${s.name} 残り${s.qty}${s.unit || ""}`).join("、");
}

  const arr = state[name], i = arr.findIndex(x => x.id === obj.id);
  if (i >= 0) arr[i] = obj; else arr.push(obj);
  render(); renderPanel();
  return true;
}

          <td><label for="bk_${esc(b.id)}" class="num strong bk-name">${esc(nameOf(b))}</label><span class="hint" style="display:block">${esc(b.species || "")}${sexMark(b.sex)}</span></td>
          <td class="hint">${esc(b.stage || "—")}<br>${esc([b.feeding, fmtCont(b.container)].filter(Boolean).join(" ") || "—")}</td>
          <td><select id="bs_${esc(b.id)}" aria-label="${esc(nameOf(b))}の状態">${STAGES.map(s => `<option${s === b.stage ? " selected" : ""}>${s}</option>`).join("")}</select></td>
          <td class="r"><span class="unit" data-unit="g" style="display:inline-grid"><input type="number" id="bw_${esc(b.id)}" step="0.1" min="0" inputmode="decimal" class="bk-w" aria-label="${esc(nameOf(b))}の体重"></span></td>
        </tr>`).join("")}</tbody>
      </table></div>
      <div class="row end"><button class="btn primary" type="submit" id="bkSubmit">記録する</button></div>
    </form>`;
}
function updateBulkCount() {
  const picks = [...document.querySelectorAll(".bk-pick")], n = picks.filter(c => c.checked).length;
  if (!$("bkCount")) return;
  $("bkCount").textContent = `${n} / ${picks.length}頭を選択中`;
  $("bkSubmit").textContent = n ? `${n}頭の交換を記録` : "個体を選んでください";
  $("bkSubmit").disabled = !n;
  $("bkAll").checked = n === picks.length;
}
// 交換の記録が一番新しいときは、個体の今の状態・えさ・容器・次回交換予定に反映する
function applyExchange(b, entry, nextManual) {
  const newest = b.logs.reduce((a, l) => !a || l.date >= a.date ? l : a, null);
  if (newest !== entry) return;
  if (entry.state && entry.state !== b.stage) {
    if (entry.state === "蛹" && !b.pupationDate) b.pupationDate = entry.date;
    if (entry.state === "成虫" && !b.eclosionDate) b.eclosionDate = entry.date;
    b.stage = entry.state;
  }
  if (entry.food) b.feeding = entry.food;
  if (entry.container) b.container = entry.container;
  // 次回交換予定は幼虫・卵のときだけ（蛹・成虫になったら自動計算しない。入っていた値は消さない）
  if (isLarva(b)) b.nextChange = nextManual || autoNext(entry.date, entry.food) || b.nextChange;
}

/* ---------- 個体の表形式一覧 ---------- */
const lastExchange = b => { const ex = exchangeLogs(b); return ex.length ? ex[ex.length - 1] : null; };
const dueTag = b => {
  if (!b.nextChange || isArchived(b) || !isLarva(b) || isHidden("nextChange")) return "";
  const d = daysUntil(b.nextChange);
  return d < 0 ? ` <span class="tag over">${-d}日超過</span>` : d <= 14 ? ` <span class="tag ${d === 0 ? "over" : "soon"}">${d === 0 ? "今日" : "あと" + d + "日"}</span>` : "";
};
const LIST_COLS = [
  { key: "code", label: "名前", sort: b => b.code || "", cell: b => `<span class="num strong">${esc(nameOf(b))}</span>${b.locked ? ' <span title="保護中">🔒</span>' : ""}` },
  { key: "species", label: "種別", cls: "w", sort: b => b.species || "", cell: b => esc(b.species || "") },
  { key: "sex", field: "sex", label: "性別", cls: "c", sort: b => b.sex === "♂" ? 0 : b.sex === "♀" ? 1 : "", cell: b => sexMark(b.sex) || '<span class="hint">—</span>' },
  { key: "line", field: "line", label: "累代", sort: b => b.line || "", cell: b => esc(b.line || "") },
  { key: "locality", field: "locality", label: "産地", cls: "w", sort: b => b.locality || "", cell: b => esc(b.locality || "") },
  { key: "stage", label: "状態", sort: b => isArchived(b) ? 100 : STAGES.indexOf(b.stage), cell: b => `<span class="pill g-${stageGroup(b.stage)}">${esc(isArchived(b) ? archiveReason(b) : b.stage || "—")}</span>` },
  { key: "feeding", label: "えさ・容器", cls: "w", sort: b => feedOf(b), cell: b => esc(feedOf(b)) },
  { key: "weight", label: "体重", cls: "r", sort: b => latestWeight(b)?.weight ?? "", cell: b => { const w = latestWeight(b); return w ? `<span class="num">${w.weight.toFixed(1)}g</span>` : ""; } },
  { key: "size", field: "sizeMm", label: "体長", cls: "r", sort: b => b.sizeMm ?? "", cell: b => b.sizeMm ? `<span class="num">${b.sizeMm}mm</span>` : "" },
  // 体長の右は羽化日（2026-11-17 あっきーさんの希望。前は孵化日）
  { key: "eclosion", field: "eclosionDate", label: "羽化日", sort: b => b.eclosionDate || "", cell: b => b.eclosionDate ? `<span class="num">${fmtDate(b.eclosionDate)}</span>` : "" },
  { key: "lastEx", label: "前回交換", sort: b => lastExchange(b)?.date || "", cell: b => { const l = lastExchange(b); return l ? `<span class="num">${fmtDate(l.date)}</span>` : ""; } },
  { key: "next", field: "nextChange", label: "次回交換", cls: "w", sort: b => isArchived(b) || !isLarva(b) ? "" : b.nextChange || "", cell: b => b.nextChange && !isArchived(b) && isLarva(b) ? `<span class="num">${fmtDate(b.nextChange)}</span>${dueTag(b)}` : "" },
];
// 「えさ・容器」：成虫は成虫のえさ・ケース、それ以外は飼育方法・容器（隠した項目は出さない）
const feedOf = b => isAdult(b)
  ? [isHidden("adultFood") ? "" : b.adultFood, isHidden("adultCase") ? "" : fmtCont(b.adultCase)].filter(Boolean).join(" ")
  : isHidden("feeding") ? "" : [b.feeding, fmtCont(b.container)].filter(Boolean).join(" ");
// 表で見せる列（隠した項目の列は出さない）
const listCols = () => LIST_COLS.filter(c => !c.field || !isHidden(c.field));

function renderBeetles() {
  const bs = state.beetles;
  const alive = bs.filter(b => !isArchived(b));
  // 上の頭数：種別「すべて」なら全部の数、種別を選んだらその種類の数（2026-11-17 あっきーさんの案）
  const aliveSp = alive.filter(b => !state.species || (b.species || "（種別なし）") === state.species);
  // 頭数の横に ♂・♀ の数（2026-11-19 あっきーさんの案。性別が不明・未入力の個体は ♂♀ に数えない）
  const cnt = test => { const l = aliveSp.filter(test), m = l.filter(b => b.sex === "♂").length, f = l.filter(b => b.sex === "♀").length;

  $("chips").innerHTML = FILTERS.map(f => `<button type="button" class="chip" data-filter="${f.key}" aria-pressed="${state.filter === f.key}">${f.label}<span class="num">${bs.filter(f.test).length}</span></button>`).join("");

  if (!state.loaded) return;
  const q = state.q.trim().toLowerCase();
  const f = FILTERS.find(x => x.key === state.filter);

  document.querySelectorAll("[data-listmode]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.listmode === state.listMode)));
  const cols = listCols();

  const shown = bs.filter(f.test)
    .filter(b => !state.species || (b.species || "（種別なし）") === state.species)

    .sort((a, c) => {
      const x = col.sort(a), y = col.sort(c);

      if (y === "" || y === null || y === undefined) return -1;
      const r = typeof x === "number" && typeof y === "number" ? x - y : jaCmp(String(x), String(y));
      return r * state.sort.dir || jaCmp(a.code || "", c.code || "");
    });
  // 一覧は最初 LIST_PAGE 頭まで出し、「もっと見る」で続きを出す（2026-11-20。数が多いと重いため）。絞り込み・検索・種別を変えたら最初に戻す

    $("list").innerHTML = `<div class="box" style="padding:0"><div class="tbl-wrap"><table class="tbl beetle-tbl">

    </table></div></div>
    <p class="hint">${moreHtml ? `${shown.length}頭のうち${page.length}頭を表示中` : `${shown.length}頭を表示中`}。見出しを押すと並べ替えます（もう一度押すと逆順。並べ替えは全部の個体が対象です）。行を押すと詳しい画面が開きます。</p>${moreHtml}`;
    return;
  }

  $("list").innerHTML = page.map(b => {
    const w = latestWeight(b);

    const foot = isArchived(b)
      ? `<span>${esc(archiveReason(b))}${b.archive?.date ? ` <span class="num">${fmtDate(b.archive.date)}</span>` : ""}${b.archive?.to ? ` ・ ${esc(b.archive.to)}` : ""}</span><span class="big">${b.archive?.price ? yen(b.archive.price) : b.sizeMm ? b.sizeMm + " mm" : "—"}</span>`
      : g === "adult"
      ? `<span>体長${b.rank && !isHidden("rank") ? ` ・ ランク${esc(b.rank)}` : ""}</span><span class="big">${b.sizeMm && !isHidden("sizeMm") ? b.sizeMm + " mm" : "—"}</span>`
      : `<span>${esc(feedOf(b)) || "最新体重"}</span><span class="big">${w ? w.weight.toFixed(1) + " g" : "—"}</span>`;
    const meta = [isHidden("locality") ? "" : b.locality || "産地不明", isHidden("line") ? "" : b.line || "累代不明", b.status && b.status !== "飼育中" && !isHidden("status") ? b.status : ""].filter(Boolean).join(" ・ ");
    return `<button type="button" class="card" data-open="${esc(b.id)}">
      <div class="card-head"><span class="card-code">${esc(nameOf(b))}${b.locked ? ' <span title="保護中">🔒</span>' : ""}</span><span class="pill g-${g}">${esc(b.stage || "—")}</span></div>
      <div class="card-body${b.image && !isHidden("image") ? " has-thumb" : ""}">

        </div>

}

const PAIR_FILTERS = [

    </button>`;

/* ---------- chart ---------- */
function chart(b) {
  const pts = (b.logs || []).filter(l => typeof l.weight === "number").sort((a, c) => a.date < c.date ? -1 : 1);
  if (pts.length < 2) return `<p class="hint">体重を2回以上記録すると推移グラフが表示されます。</p>`;
  const W = 500, H = 190, L = 40, R = 16, T = 18, B = 28;
  const t0 = +new Date(pts[0].date), t1 = +new Date(pts[pts.length - 1].date);
  const maxW = Math.ceil(Math.max(...pts.map(p => p.weight)) / 5) * 5 || 5;
  const x = d => L + (W - L - R) * ((+new Date(d) - t0) / Math.max(1, t1 - t0));
  const y = v => T + (H - T - B) * (1 - v / maxW);
  const ticks = [0, maxW / 2, maxW];
  const line = pts.map(p => `${x(p.date).toFixed(1)},${y(p.weight).toFixed(1)}`).join(" ");
  const area = `${L},${y(0)} ${line} ${x(pts[pts.length - 1].date).toFixed(1)},${y(0)}`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="体重推移">
    ${ticks.map(v => `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${v}g</text>`).join("")}
    <polygon class="area" points="${area}"/>
    <polyline class="line" points="${line}"/>
    ${pts.map((p, i) => `<circle class="dot${i === pts.length - 1 ? " last" : ""}" cx="${x(p.date)}" cy="${y(p.weight)}" r="${i === pts.length - 1 ? 4.5 : 3.5}"/><text class="pt" x="${x(p.date)}" y="${y(p.weight) - 9}" text-anchor="${i === 0 ? "start" : i === pts.length - 1 ? "end" : "middle"}">${p.weight.toFixed(1)}</text>`).join("")}
    <text class="axis" x="${L}" y="${H - 8}">${fmtDate(pts[0].date)}</text>
    <text class="axis" x="${W - R}" y="${H - 8}" text-anchor="end">${fmtDate(pts[pts.length - 1].date)}</text>
  </svg>`;
}

/* ---------- panel ---------- */
function openPanel(id, mode = "view") {
  state.openId = id; state.mode = mode; state.draftImage = undefined; state.backTo = null; state.copyFrom = null; state.mixDraft = null; state.pick = null;
  if ($("overlay").hidden) state.openVer = state.dataVer || 0; // 開いたときの印。閉じるまでに記録が変わらなければ、一覧は描き直さない
  $("overlay").hidden = false;
  renderPanel();
  $("panel").scrollTop = 0;
}

  state.openId = null; state.pendingImport = null; state.pendingUpdate = null; state.csvImp = null; state.backTo = null; state.dirty = false; $("overlay").hidden = true;

}
// 入力画面：外側のクリックでは閉じない（×・キャンセル・Escだけで閉じる）
const INPUT_MODES = ["edit", "new", "pairEdit", "pairNew", "kids", "bulk", "sale", "money", "stock", "mix", "stale", "listing", "sp", "sheet"];
// ここに入力すると「まだ保存していない」とみなすフォーム
const DIRTY_FORMS = ["editForm", "pairForm", "kidsForm", "bulkForm", "saleForm", "moneyForm", "stockForm", "logForm", "archiveForm", "mixForm", "listingForm"];
// 出品文の画面は、文章を手で直したときだけ「保存していない」とみなす（チェックや絞り込みでは聞かない）
const markDirty = el => { if (el.closest("#listingForm") && !["lsTitle", "lsBody", "lsX"].includes(el.id)) return; if (!["slSearch", "lbSearch", "slStage", "lbStage"].includes(el.id) && DIRTY_FORMS.includes(el.closest("form")?.id)) state.dirty = true; };
// 入力した内容があれば、確かめてから閉じる・戻る
function leavePanel(fn) {
  if (state.dirty && !confirm("入力した内容は、まだ保存されていません。保存せずに閉じますか？")) return;
  state.dirty = false;
  fn();
}

const fact = (label, value) => value && value !== "—" ? `<dt>${label}</dt><dd>${value}</dd>` : "";
// 「表示する項目」で隠した項目は出さない
const sf = (key, html) => isHidden(key) ? "" : html;
const dateFact = (label, d) => d ? `<dt>${label}</dt><dd class="num">${fmtDate(d)}</dd>` : "";
// 親の名前：台帳にいる個体ならリンクにする
const parentLink = (name, size) => {
  if (!name) return "";
  const p = byName(name);
  return `${p ? `<button class="link" type="button" data-open="${esc(p.id)}">${esc(name)}</button>` : esc(name)}${size ? ` <span class="num">${size}mm</span>` : ""}`;
};

// ペア相手はペアリングの記録から出す（♂・♀の欄にこの個体の名前があるペア）
const pairingsOf = b => b.code ? state.pairs.filter(p => p.maleName === b.code || p.femaleName === b.code)
  .sort((a, c) => (c.startDate || "").localeCompare(a.startDate || "")) : [];
const partnerName = (p, b) => p.maleName === b.code ? p.femaleName : p.maleName;
function partnerHtml(b) {
  const ps = pairingsOf(b);
  const rows = ps.map(p => `${parentLink(partnerName(p, b), p.maleName === b.code ? p.femaleSize : p.maleSize) || "—"}
    <span class="hint" style="display:inline">（<button class="link" type="button" data-openpair="${esc(p.id)}">${esc(p.name || "ペア")}</button>・${esc(p.status || "")}）</span>`);
  // 昔の「ペア相手」の欄に入れた値は、ペアリングに無ければそのまま見せる
  if (b.pairWith && !ps.some(p => partnerName(p, b) === b.pairWith)) rows.push(`${esc(b.pairWith)} <span class="hint" style="display:inline">（前の入力）</span>`);
  return rows.join("<br>");
}
const partnerText = b => {
  const names = pairingsOf(b).map(p => partnerName(p, b)).filter(Boolean);
  if (b.pairWith && !names.includes(b.pairWith)) names.push(b.pairWith);
  return [...new Set(names)].join("・");
};

function renderPanel() {
  if ($("overlay").hidden) return;
  const p = $("panel");
  const m = state.mode;
  state.dirty = false; // 画面を作り直すと入力欄も新しくなる
  if (m === "backup") return p.innerHTML = backupPanel();
  if (m === "sheet") return p.innerHTML = sheetPanel();
  if (m === "care") return p.innerHTML = carePanel();
  if (m === "sp") { p.innerHTML = spPanel(); return updateSp(); }
  if (m === "year") { p.innerHTML = yearPanel(); return updateYear(); }
  if (m === "pairLabels") { p.innerHTML = pairLabelsForm(); return updatePairLabels(); }
  if (m === "pair") return p.innerHTML = pairView(state.pairs.find(x => x.id === state.openId));
  if (m === "pairEdit" || m === "pairNew") return p.innerHTML = pairForm(m === "pairNew" ? null : state.pairs.find(x => x.id === state.openId));
  if (m === "kids") return p.innerHTML = kidsForm(state.pairs.find(x => x.id === state.openId));
  if (m === "bulk") { p.innerHTML = bulkForm(); return updateBulkCount(); }
  if (m === "sale") { p.innerHTML = saleForm(); return updateSaleCount(); }
  if (m === "labels") { p.innerHTML = labelsForm(); return updateLabels(); }
  if (m === "money") return p.innerHTML = moneyForm(state.money.find(x => x.id === state.openId) || null);
  if (m === "stock") return p.innerHTML = stockForm(state.stock.find(x => x.id === state.openId) || null);
  if (m === "mix") return p.innerHTML = mixForm(mixes().find(x => x.id === state.openId) || null);
  if (m === "stale") return p.innerHTML = stalePanel();
  if (m === "listing") { p.innerHTML = listingForm(); updateListing(true); state.dirty = false; return; }
  const b = state.beetles.find(x => x.id === state.openId);
  if (m === "edit" || m === "new") return p.innerHTML = editForm(m === "new" ? null : b);
  if (!b) return closePanel();
  p.innerHTML = beetleView(b);
}

function backButton() {
  return state.backTo ? `<button class="link" type="button" data-back style="justify-self:start;font-size:13px">← ${esc(state.backTo.label)}に戻る</button>` : "";
}

function beetleView(b) {
  const logs = (b.logs || []).map((l, i) => ({ ...l, i })).sort((a, c) => a.date < c.date ? 1 : -1);
  const nc = b.nextChange ? daysUntil(b.nextChange) : null;
  const sibs = siblings(b);
  const g = stageGroup(b.stage);
  const pair = b.pairId ? state.pairs.find(x => x.id === b.pairId) : null;
  const arch = isArchived(b);
  const archiveBox = arch ? `
    <div class="box archived">
      <h3 class="section-title">履歴</h3>
      <dl class="facts">
        <dt>理由</dt><dd>${esc(archiveReason(b))}${b.archive?.saleType ? `（${esc(b.archive.saleType)}）` : ""}</dd>
        ${dateFact("日付", b.archive?.date)}
        ${fact("金額", b.archive?.price ? `<span class="num">${yen(b.archive.price)}</span>${saleMates(b).length ? `<span class="hint" style="display:inline">（${saleMates(b).length + 1}頭まとめての金額）</span>` : ""}` : "")}
        ${fact("一緒に販売", saleMates(b).map(x => `<button class="link" type="button" data-open="${esc(x.id)}">${esc(nameOf(x))}</button>${sexMark(x.sex)}`).join("、"))}
        ${fact("相手", esc(b.archive?.to))}
        ${fact("メモ", esc(b.archive?.memo))}
      </dl>
      <div class="row"><button class="btn small" type="button" data-unarchive>飼育中に戻す</button></div>
    </div>` : `
    <div class="box">
      <div class="row" style="justify-content:space-between">
        <h3 class="section-title">販売・死亡・譲渡</h3>
        <span class="row">${b.status === "出品中" ? `<span class="pill in">出品中</span><button class="btn small" type="button" data-unlist="${esc(b.id)}">出品を取り消す</button>` : ""}<button class="btn small primary" type="button" data-sell="${esc(b.id)}">販売する</button></span>
      </div>
      <p class="hint">「販売する」では単体販売・ペア販売・複数引き販売を選べて、一緒に売る個体もまとめて記録できます。</p>
      <details id="archiveBox">
        <summary class="hint" style="cursor:pointer">死亡・譲渡として履歴へ移す</summary>
        <form id="archiveForm" style="margin-top:10px">
          <div class="fields">
            <label>理由<select id="aReason">${["死亡", "譲渡"].map(r => `<option>${r}</option>`).join("")}</select></label>
            <label>日付<input type="date" id="aDate" value="${today()}" required></label>
            <label class="wide">相手（譲渡のとき）<input type="text" id="aTo" placeholder="例 譲渡先"></label>
            <label class="wide">メモ<input type="text" id="aMemo"></label>
          </div>
          <p class="hint">履歴に移した個体は個体管理の一覧から外れ、「履歴」タブで見られます。</p>
          <div class="row end"><button class="btn primary" type="submit">履歴へ移す</button></div>
        </form>
      </details>
    </div>`;
  return `
    ${backButton()}
    <div class="panel-head">
      <div><div class="num" style="color:var(--muted);font-size:13px">${esc(nameOf(b))}</div>
      <h2 id="panelTitle">${esc(b.species)}${isHidden("sex") ? "" : sexMark(b.sex)}</h2></div>
      <button class="close" type="button" data-close aria-label="閉じる">×</button>
    </div>
    ${b.image && !isHidden("image") ? `<div class="photo"><img src="${b.image}" alt="${esc(nameOf(b))}の写真"></div>` : ""}
    <div class="box">
      <div class="row" style="justify-content:space-between"><span class="row"><span class="pill g-${g}">${esc(b.stage || "—")}</span>${b.status && !isHidden("status") ? `<span class="hint">${esc(b.status)}</span>` : ""}${b.locked ? '<span class="pill lock">🔒 保護中</span>' : ""}</span>
      <span class="row"><button class="btn small" type="button" data-lock aria-pressed="${!!b.locked}">${b.locked ? "保護を外す" : "🔒 保護する"}</button><button class="btn small" type="button" data-sheet="${esc(b.id)}">累代票</button><button class="btn small" type="button" data-care="${esc(b.id)}">飼育記録シート</button><button class="btn small" type="button" data-copy="${esc(b.id)}">コピー</button><button class="btn small" type="button" data-label="${esc(b.id)}">ラベル</button><button class="btn small" type="button" data-edit>編集</button></span></div>
      <dl class="facts">
        ${sf("locality", fact("産地", esc(b.locality)))}
        ${sf("line", fact("累代", esc(b.line)))}
        ${sf("rank", fact("ランク", esc(b.rank)))}
        ${sf("parents", fact("♂親", parentLink(b.fatherName, b.fatherSize)))}
        ${sf("parents", fact("♀親", parentLink(b.motherName, b.motherSize)))}
        ${fact("ペア", pair ? `<button class="link" type="button" data-openpair="${esc(pair.id)}">${esc(pair.name)}</button>` : "")}
        ${fact("ペア相手", partnerHtml(b))}
        ${sf("breeder", fact("ブリーダー", esc(b.breeder)))}
        ${g === "adult" ? `${sf("feedStartDate", dateFact("後食開始日", b.feedStartDate))}
        ${sf("adultFood", fact("成虫のえさ", esc(b.adultFood)))}
        ${sf("adultCase", fact("ケース", esc(fmtCont(b.adultCase))))}`
        : sf("feeding", fact("飼育方法", esc([b.feeding, fmtCont(b.container)].filter(Boolean).join(" ・ "))))}
        ${g === "larva" && !arch ? sf("nextChange", fact("次回交換", b.nextChange ? `<span class="num">${fmtDate(b.nextChange)}</span>${nc !== null && nc <= 14 ? ` <span class="tag ${nc <= 0 ? "over" : "soon"}">${nc < 0 ? -nc + "日超過" : nc === 0 ? "今日" : "あと" + nc + "日"}</span>` : ""}` : "")) : ""}
        ${sf("storage", fact("保管場所", esc(b.storage)))}
        ${sf("cumTemp", fact("積算温度", b.cumTemp ? `<span class="num">${b.cumTemp}℃・日</span>` : ""))}
        ${sf("collectDate", dateFact("採集日", b.collectDate))}
        ${sf("collectPlace", fact("採集場所", esc(b.collectPlace)))}
        ${sf("collectState", fact("採集時状態", esc(b.collectState)))}
        ${fact("親個体メモ", esc(b.parents))}
        ${sf("memo", fact("コメント", esc(b.memo)))}
      </dl>
    </div>
    <div class="box"><h3 class="section-title">成長の記録</h3>${growthTable(b)}</div>
    ${photoBox(b)}
    ${archiveBox}
    ${sibs.length ? `<div class="box"><h3 class="section-title">兄弟（同じ両親）${sibs.length}頭</h3><p class="hint" style="margin:0">この親の成績（この個体も入れて）：${esc(statsText(lineStats([b, ...sibs], b.species)))}</p><div class="sibs">${sibs.map(s => `<button type="button" data-open="${esc(s.id)}">${esc(nameOf(s))}${sexMark(s.sex)} <span class="hint">${esc(s.stage || "")}</span></button>`).join("")}</div></div>` : ""}
    <div class="box chart"><h3 class="section-title">体重推移</h3>${chart(b)}</div>
    <div class="box">
      <h3 class="section-title">飼育記録</h3>
      ${logs.length ? `<ul class="logs">${logs.map(l => {
        const meas = [typeof l.weight === "number" ? `${l.weight.toFixed(1)}g` : "", typeof l.length === "number" ? `体長${l.length}mm` : "", typeof l.headWidth === "number" ? `頭幅${l.headWidth}mm` : ""].filter(Boolean).join(" ");
        const feed = [l.food, l.additive ? `+${l.additive}` : "", fmtCont(l.container), l.bottle].filter(Boolean).join(" ");
        return `<li><span class="num">${fmtDate(l.date)}</span>
        <span style="min-width:0"><span class="state">${esc(l.state || l.kind || "")}</span>${l.work ? ` <span class="hint" style="display:inline">${esc(l.work)}${isExchange(l) ? `（${exchangeLogs(b).indexOf(b.logs[l.i]) + 1}回目）` : ""}</span>` : ""}
          ${meas ? `<span class="meas"> ${meas}</span>` : ""}
          ${feed || l.note ? `<span class="note">${esc([feed, l.note].filter(Boolean).join(" ・ "))}</span>` : ""}</span>
        <button class="del" type="button" data-dellog="${l.i}" aria-label="この記録を削除">削除</button></li>`;
      }).join("")}</ul>` : '<p class="hint">まだ記録はありません。</p>'}
      <form id="logForm">
        <div class="fields">
          <label>日付<input type="date" id="logDate" value="${today()}" required></label>
          <label>状態<select id="logState">${STAGES.map(s => `<option${s === b.stage ? " selected" : ""}>${s}</option>`).join("")}</select></label>
          <label>作業<select id="logWork">${WORKS.map(k => `<option>${k}</option>`).join("")}</select></label>
          <label>えさ${masterSelect("logFood", "food", g === "adult" ? b.adultFood : b.feeding)}</label>
          <label>添加剤・配合${additiveSelect("logAdd", "")}</label>
          <label>${g === "adult" ? "ケース" : "容器"}${masterSelect("logContainer", "container", g === "adult" ? b.adultCase : b.container)}</label>
          <label class="unit" data-unit="g">体重<input type="number" id="logWeight" step="0.1" min="0" inputmode="decimal"></label>
          <label class="unit" data-unit="mm">体長<input type="number" id="logLength" step="0.1" min="0" inputmode="decimal"></label>
          <label class="unit" data-unit="mm">頭幅<input type="number" id="logHead" step="0.1" min="0" inputmode="decimal"></label>
          <label class="wide">コメント<input type="text" id="logNote" placeholder="例 暴れなし、食痕多め"></label>
          <label class="wide"${g === "larva" && !isHidden("nextChange") ? "" : " hidden"}>次回交換予定（えさ交換なら空欄で自動計算）<input type="date" id="logNext"></label>
        </div>
        <p class="hint">${g === "adult" ? "状態を変えると個体のステージも更新されます。えさ・ケースを変えると個体の「成虫のえさ」「ケース」も更新されます。" : "状態を変えると個体のステージも更新されます。えさ・容器を変えると個体の飼育方法も更新されます。"}</p>
        <div class="row end"><button class="btn primary" type="submit">記録を追加</button></div>
      </form>
    </div>`;
}

/* ---------- 成長の記録（孵化・割り出し → 交換1〜4回目 → 蛹化 → 羽化 の順） ---------- */
const feedText = l => [l.food, l.additive ? `+${l.additive}` : ""].filter(Boolean).join(" ");
function growthTable(b) {
  const ex = exchangeLogs(b);
  const rows = Array.from({ length: Math.max(4, ex.length) }, (_, i) => ex[i] || null);
  const d = v => v ? `<span class="num">${fmtDate(v)}</span>` : '<span class="hint">—</span>';
  const g = v => typeof v === "number" ? `<span class="num">${v.toFixed(1)}g</span>` : "";
  const h = isHidden;
  const size = [b.sizeMm && !h("sizeMm") ? `<span class="num">${b.sizeMm}mm</span>` : "", b.headWidth && !h("headWidth") ? `頭幅 <span class="num">${b.headWidth}mm</span>` : "", b.jaw && !h("jaw") ? `あご <span class="num">${b.jaw}mm</span>` : ""].filter(Boolean).join(" ・ ");
  // 隠した項目の行・欄は出さない（記録は残る）
  return `<div class="tbl-wrap"><table class="tbl growth">
    <thead><tr><th></th><th>日付</th><th class="r">g数</th><th>えさ・添加剤</th><th>ボトル</th></tr></thead>
    <tbody>
      ${h("hatchDate") && h("harvestDate") ? "" : `<tr><th>${h("hatchDate") ? "割り出し日" : "孵化日"}</th><td>${d(h("hatchDate") ? b.harvestDate : b.hatchDate)}</td><td colspan="3">${h("hatchDate") || h("harvestDate") ? "" : `<span class="hint">割り出し日</span> ${d(b.harvestDate)}`}</td></tr>`}
      ${rows.map((l, i) => `<tr${l ? "" : ' class="dim"'}><th>交換${i + 1}回目</th><td>${l ? d(l.date) : ""}</td><td class="r">${l ? g(l.weight) : ""}</td><td>${l ? esc(feedText(l)) : ""}</td><td>${l ? esc(fmtCont(l.container) || l.bottle || "") : ""}</td></tr>`).join("")}
      ${h("pupationDate") && h("pupaWeight") ? "" : `<tr><th>蛹化日</th><td>${h("pupationDate") ? "" : d(b.pupationDate)}</td><td class="r">${h("pupaWeight") ? "" : g(b.pupaWeight)}</td><td colspan="2"></td></tr>`}
      ${h("eclosionDate") && !size ? "" : `<tr><th>羽化日</th><td>${h("eclosionDate") ? "" : d(b.eclosionDate)}</td><td colspan="3">${size || ""}</td></tr>`}
    </tbody>
  </table></div>`;
}

/* ---------- えさ交換（個体フォームで1回目から入力） ---------- */
const MIN_EXCHANGE_ROWS = 4;
const isExchange = l => l.work === "えさ交換" || l.kind === "菌糸瓶交換";
const exchangeLogs = b => (b.logs || []).filter(isExchange).sort((a, c) => (a.date || "").localeCompare(c.date || ""));
function exchangeRows(b) {
  const ex = exchangeLogs(b);
  const n = Math.max(MIN_EXCHANGE_ROWS, ex.length + 1);
  return Array.from({ length: n }, (_, i) => {
    const l = ex[i] || {};
    const k = i + 1;
    return `<div class="xrow">
      <span class="xno">${k}回目</span>
      <label>日付<input type="date" id="xDate${k}" value="${esc(l.date || "")}"></label>
      <label class="unit" data-unit="g">体重<input type="number" id="xWeight${k}" step="0.1" min="0" inputmode="decimal" value="${esc(l.weight ?? "")}"></label>
      <label>えさ${masterSelect("xFood" + k, "food", l.food)}</label>
      <label>添加剤・配合${additiveSelect("xAdd" + k, l.additive)}</label>
      <label>ボトル${masterSelect("xCont" + k, "container", l.container || l.bottle)}</label>
      <label>状態<select id="xState${k}"><option value=""></option>${STAGES.map(s => `<option${s === l.state ? " selected" : ""}>${s}</option>`).join("")}</select></label>
      <label class="unit" data-unit="mm">頭幅<input type="number" id="xHead${k}" step="0.1" min="0" inputmode="decimal" value="${esc(l.headWidth ?? "")}"></label>
      <label class="xnote">コメント<input type="text" id="xNote${k}" value="${esc(l.note || "")}"></label>
    </div>`;
  }).join("") + `<p class="hint wide">日付を入れた回だけ保存されます。日付を消すとその回の記録は消えます。4回目まで埋まると、次の空欄が増えます。</p>`;
}
// 編集画面の状態に合わせて、成虫・幼虫の欄を切り替える。成虫になったら交換の欄は「幼虫のときの記録を開く」にたたむ
function setStageView() {
  const f = $("editForm");
  if (!f || !$("fStage")) return;
  const g = stageGroup($("fStage").value);
  if (f.dataset.g === g) return;
  f.dataset.g = g;
  if ($("xWrap")) $("xWrap").open = g !== "adult";
}
// フォームの交換欄から記録を作り直す（交換以外の記録はそのまま）
function readExchangeRows(old) {
  const ex = exchangeLogs(old || {});
  const rows = [];
  for (let k = 1; $("xDate" + k); k++) {
    const date = $("xDate" + k).value;
    if (!date) continue;
    const row = { ...(ex[k - 1] || {}), date, work: "えさ交換", state: $("xState" + k).value, food: $("xFood" + k).value.trim(), additive: $("xAdd" + k).value, container: $("xCont" + k).value.trim(), note: $("xNote" + k).value.trim() };
    withMix(row);
    delete row.kind; delete row.bottle;
    [["weight", "xWeight"], ["headWidth", "xHead"]].forEach(([f, id]) => { const v = $(id + k).value; if (v === "") delete row[f]; else row[f] = Number(v); });
    rows.push(row);
  }
  return [...((old && old.logs) || []).filter(l => !isExchange(l)), ...rows];
}

// 親の欄の候補：その性別の個体を、名前順に（種別・サイズ・履歴なら理由も添える）
// 親の候補：同じ性別、種別を選んでいればその種類だけ（2026-11-20。個体が多いと候補が多すぎて重いため）。種別が空なら全部
const parentOptions = (list, sex, sp) => list.filter(x => x.sex === sex && x.code && (!sp || x.species === sp))
  .sort((a, c) => jaCmp(a.code, c.code))
  .map(x => `<option value="${esc(x.code)}">${esc([x.species, x.sizeMm ? x.sizeMm + "mm" : "", isArchived(x) ? "（" + archiveReason(x) + "）" : ""].filter(Boolean).join(" "))}</option>`).join("");
function editForm(b) {
  const src = !b && state.copyFrom ? state.beetles.find(x => x.id === state.copyFrom) : null;
  const v = b || (src ? copyDraft(src) : { stage: "幼虫(1令)", sex: "不明", status: "飼育中" });
  const img = state.draftImage !== undefined ? state.draftImage : v.image || "";
